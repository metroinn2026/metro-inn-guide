<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動資訊｜北投旅圖</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="supabase-config.js"></script></head>
<body class="activity-detail-page"><div id="header"></div>
<main><section class="activity-detail-hero"><div class="container"><a class="activity-back" href="activities.html">← 返回近期活動</a><div id="activityHeroContent"><p class="activity-message">活動資料載入中…</p></div></div></section>
<section class="section activity-detail-section"><div class="container activity-detail-layout"><article id="activityDetails" class="activity-detail-main"></article><aside id="activityDirections" class="activity-directions"></aside></div></section></main>
<div id="footer"></div>
<script>
document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();
const hero=document.getElementById('activityHeroContent'),details=document.getElementById('activityDetails'),directions=document.getElementById('activityDirections');
function todayTaipei(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function safeUrl(raw){if(!raw)return '';try{const u=new URL(raw,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function state(x){const d=todayTaipei();return x.end_date<d?'活動已結束':x.start_date>d?'即將開始':'活動中';}
function dateText(v){if(!v)return '日期未提供';const [y,m,d]=v.slice(0,10).split('-');return `${y}.${m}.${d}`;}
function addInfo(label,value,asLink=false){if(!value)return;const row=document.createElement('div');row.className='activity-info-row';const key=document.createElement('strong');key.textContent=label;const val=document.createElement(asLink?'a':'p');if(asLink){val.href=safeUrl(value);val.target='_blank';val.rel='noopener noreferrer';val.textContent='開啟官方活動資訊 ↗';}else val.textContent=value;row.append(key,val);directions.append(row);}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){hero.textContent='找不到活動編號。';return;}try{const q=new URLSearchParams({select:'*',id:`eq.${id}`,is_published:'eq.true',limit:'1'});const r=await fetch(`${SUPABASE_URL}/rest/v1/events?${q}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!r.ok)throw Error(`讀取失敗 ${r.status}`);const rows=await r.json(),item=rows[0];if(!item||item.end_date<todayTaipei()&&item.end_behavior!=='show_ended'){hero.textContent='這筆活動目前沒有公開，或已結束。';return;}document.title=`${item.title}｜北投近期活動｜北投旅圖`;const badge=document.createElement('span');badge.className='event-status '+(state(item)==='活動中'?'ongoing':state(item)==='活動已結束'?'ended':'upcoming');badge.textContent=state(item);const meta=document.createElement('div');meta.className='activity-detail-meta';meta.append(badge,document.createTextNode(`${dateText(item.start_date)} – ${dateText(item.end_date)}${item.hours?'｜'+item.hours:''}`));const title=document.createElement('h1');title.textContent=item.title||'在地活動';const category=document.createElement('p');category.className='activity-category';category.textContent=item.category||'在地活動';hero.replaceChildren(category,title,meta);const image=safeUrl(item.cover_image);if(image){const img=document.createElement('img');img.className='activity-detail-image';img.src=image;img.alt=item.title||'活動圖片';details.append(img);if(item.cover_image_source){const source=document.createElement('p');source.className='image-source-caption';source.textContent='圖片來源：'+item.cover_image_source;details.append(source);}}if(item.summary){const summary=document.createElement('p');summary.className='activity-detail-lead';summary.textContent=item.summary;details.append(summary);}if(item.content){const content=document.createElement('div');content.className='activity-detail-content';content.textContent=item.content;details.append(content);}directions.innerHTML='<h2>活動資訊與交通</h2>';addInfo('活動地點',item.venue_name);addInfo('地址',item.address);addInfo('怎麼去',item.transport);addInfo('活動時間',item.hours);addInfo('費用／入場方式',item.admission);const map=safeUrl(item.google_map)||(item.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(item.address):'');if(map)addInfo('地圖',map,true);addInfo('主辦單位資訊',item.official_url,true);const note=document.createElement('p');note.className='activity-detail-note';note.textContent='活動日期、時間及內容可能異動，出發前請以主辦單位最新公告為準。';directions.append(note);}catch(error){console.error(error);hero.textContent='目前無法載入活動資料，請稍後再試。';}}
load();
</script></body></html>
