<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動資訊｜北投旅圖</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="supabase-config.js"></script></head>
<body class="activity-detail-page"><div id="header"></div>
<main><section class="activity-detail-hero"><div class="container"><a class="activity-back" href="activities.html">← 返回近期活動</a><div id="activityHeroContent"><p class="activity-message">活動資料載入中…</p></div></div></section>
<section class="section activity-detail-section"><div class="container activity-detail-layout"><article id="activityDetails" class="activity-detail-main"></article><aside id="activityDirections" class="activity-detail-aside"></aside></div><div class="container activity-map-wrap" id="activityMapWrap" hidden><h2>活動地圖</h2><iframe id="activityMap" class="activity-map-embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="活動地點 Google 地圖" allowfullscreen></iframe><a id="activityMapLink" class="activity-map-link" target="_blank" rel="noopener noreferrer">在 Google Maps 查看路線 ↗</a></div></section></main>
<div id="footer"></div>
<script>
document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();
const hero=document.getElementById('activityHeroContent'),details=document.getElementById('activityDetails'),directions=document.getElementById('activityDirections');
function todayTaipei(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function safeUrl(raw){if(!raw)return '';try{const u=new URL(raw,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function state(x){const d=todayTaipei();return x.end_date<d?'活動已結束':x.start_date>d?'即將開始':'活動中';}
function dateText(v){if(!v)return '日期未提供';const [y,m,d]=v.slice(0,10).split('-');return `${y}.${m}.${d}`;}
function addRow(root,label,value,{link='',linkText=''}={}){if(!value&&!link)return;const row=document.createElement('div');row.className='activity-info-row';const key=document.createElement('strong');key.textContent=label;row.append(key);const val=document.createElement('div');val.className='activity-info-value';if(value){const text=document.createElement('p');text.textContent=value;val.append(text);}if(link){const a=document.createElement('a');a.href=safeUrl(link);a.target='_blank';a.rel='noopener noreferrer';a.textContent=linkText||'開啟連結 ↗';val.append(a);}row.append(val);root.append(row);}
function googleQueryUrl(query,embed=false){const u=new URL('https://www.google.com/maps');u.searchParams.set('q',query);if(embed)u.searchParams.set('output','embed');return u.href;}
function renderSide(item){
  directions.replaceChildren();
  const info=document.createElement('section');info.className='activity-side-panel activity-info-panel';
  const kicker=document.createElement('p');kicker.className='compact-transit-kicker';kicker.textContent='EVENT INFORMATION';
  const infoTitle=document.createElement('h2');infoTitle.textContent='活動資訊';info.append(kicker,infoTitle);
  addRow(info,'活動日期',`${dateText(item.start_date)} – ${dateText(item.end_date)}`);
  addRow(info,'活動時間',item.hours);
  addRow(info,'活動地點',item.venue_name);
  addRow(info,'地址',item.address,{link:item.address?googleQueryUrl(item.address):'',linkText:'Google 地圖 ↗'});
  addRow(info,'費用／入場',item.admission);
  addRow(info,'主辦單位資訊','',{link:item.official_url,linkText:'查看主辦單位公告 ↗'});
  directions.append(info);

  const transit=document.createElement('section');transit.className='activity-side-panel compact-transit activity-transit-panel';
  const transitKicker=document.createElement('div');transitKicker.className='compact-transit-kicker';transitKicker.textContent='TRANSPORT GUIDE';
  const transitHead=document.createElement('div');transitHead.className='compact-transit-head';const transitTitle=document.createElement('h2');transitTitle.textContent='大眾運輸交通指南';transitHead.append(transitTitle);
  const text=document.createElement('p');text.className='activity-transit-text';text.textContent=item.transport||'活動交通資訊尚未補充，出發前請查看主辦單位公告。';
  transit.append(transitKicker,transitHead,text);
  const destination=[item.venue_name,item.address].filter(Boolean).join(' ');
  if(destination){const route=new URL('https://www.google.com/maps/dir/');route.searchParams.set('api','1');route.searchParams.set('origin','北捷行旅 北投會館 台北市北投區大業路527巷88號');route.searchParams.set('destination',destination);route.searchParams.set('travelmode','transit');const a=document.createElement('a');a.className='compact-transit-map';a.href=route.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='從北捷行旅規劃大眾運輸路線 ↗';transit.append(a);}
  directions.append(transit);
}
function renderMap(item){const query=[item.venue_name,item.address].filter(Boolean).join(' ')||item.title||'';if(!query)return;const wrap=document.getElementById('activityMapWrap');document.getElementById('activityMap').src=googleQueryUrl(query,true);const link=document.getElementById('activityMapLink');link.href=safeUrl(item.google_map)||googleQueryUrl(query);wrap.hidden=false;}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){hero.textContent='找不到活動編號。';return;}try{const q=new URLSearchParams({select:'*',id:`eq.${id}`,is_published:'eq.true',limit:'1'});const r=await fetch(`${SUPABASE_URL}/rest/v1/events?${q}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!r.ok)throw Error(`讀取失敗 ${r.status}`);const rows=await r.json(),item=rows[0];if(!item||item.end_date<todayTaipei()&&item.end_behavior!=='show_ended'){hero.textContent='這筆活動目前沒有公開，或已結束。';return;}document.title=`${item.title}｜北投近期活動｜北投旅圖`;const badge=document.createElement('span');badge.className='event-status '+(state(item)==='活動中'?'ongoing':state(item)==='活動已結束'?'ended':'upcoming');badge.textContent=state(item);const meta=document.createElement('div');meta.className='activity-detail-meta';meta.append(badge,document.createTextNode(`${dateText(item.start_date)} – ${dateText(item.end_date)}${item.hours?'｜'+item.hours:''}`));const title=document.createElement('h1');title.textContent=item.title||'在地活動';const category=document.createElement('p');category.className='activity-category';category.textContent=item.category||'在地活動';hero.replaceChildren(category,title,meta);const image=safeUrl(item.cover_image);if(image){const img=document.createElement('img');img.className='activity-detail-image';img.src=image;img.alt=item.title||'活動圖片';details.append(img);if(item.cover_image_source){const source=document.createElement('p');source.className='image-source-caption';source.textContent='圖片來源：'+item.cover_image_source;details.append(source);}}if(item.summary){const summary=document.createElement('p');summary.className='activity-detail-lead';summary.textContent=item.summary;details.append(summary);}if(item.content){const content=document.createElement('div');content.className='activity-detail-content';content.textContent=item.content;details.append(content);}renderSide(item);renderMap(item);const note=document.createElement('p');note.className='activity-detail-note';note.textContent='活動日期、時間及內容可能異動，出發前請以主辦單位最新公告為準。';details.append(note);}catch(error){console.error(error);hero.textContent='目前無法載入活動資料，請稍後再試。';}}
load();
</script></body></html>
