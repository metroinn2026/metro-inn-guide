<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>活動資訊｜北投旅圖</title>
  <link rel="stylesheet" href="style.css?v=20261003-auto-reading">
  <script src="data.js"></script>
  <script src="related-reading.js?v=20261003-auto-reading"></script>
  <script src="supabase-config.js"></script>
  <script src="transit-duration.js"></script>
  <script src="transport-guide.js?v=20261003-station-parser-fix"></script>
</head>
<body id="top" class="activity-detail-page">
  <div id="header"></div>
  <section class="activity-detail-hero">
    <div class="container">
      <a class="activity-back" href="activities.html">← 返回近期活動</a>
      <div id="activityHeroContent"><p class="activity-message">活動資料載入中…</p></div>
    </div>
  </section>
  <section class="crumb">
    <div class="container">
      <div id="activityBreadcrumb">首頁 〉 近期活動</div>
      <button class="share-icon" id="activityShare" type="button" aria-label="分享此活動">⇪</button>
    </div>
  </section>
  <main class="container article-wrap single-point activity-article-wrap">
    <article id="activityDetails" class="activity-detail-main">
      <p class="lead" id="activityLead"></p>
      <section class="story" id="activityStory"></section>
      <section id="activityInfo" class="info-card point-info activity-info-card">
        <div class="info-head-row">
          <div><div class="kicker">INFORMATION</div><h3>活動資訊</h3></div>
        </div>
        <div class="info-row"><span class="info-label">活動日期</span><span id="infoDates">尚未提供</span></div>
        <div class="info-row"><span class="info-label">活動時間</span><span id="infoHours">尚未提供</span></div>
        <div class="info-row"><span class="info-label">活動地點</span><span id="infoVenue">尚未提供</span></div>
        <div class="info-row"><span class="info-label">地址</span><span id="infoAddress">尚未提供</span></div>
        <div class="info-row"><span class="info-label">費用／入場</span><span id="infoAdmission">尚未提供</span></div>
        <div class="info-row"><span class="info-label">活動類型</span><span id="infoCategory">尚未提供</span></div>
        <div class="info-row"><span class="info-label">備註</span><span>活動日期、時間及內容可能異動，請以主辦單位最新公告為準。</span></div>
        <div class="info-actions multi">
          <a id="activityMapButton" class="button" target="_blank" rel="noopener noreferrer">Google Map</a>
          <a id="activityOfficialButton" class="button outline" target="_blank" rel="noopener noreferrer" hidden>主辦單位公告</a>
        </div>
        <div class="detail-map-frame" id="activityMapFrame" hidden>
          <h2>活動地圖</h2>
          <iframe id="activityMap" class="map-embed small" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="活動地點 Google 地圖" allowfullscreen></iframe>
        </div>
      </section>
    </article>
    <aside class="sticky-panel activity-sticky-panel"><div id="activityTransportGuide"></div></aside>
  </main>
  <section id="related" class="section related" hidden></section>
  <div id="footer"></div>
  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const hero = document.getElementById('activityHeroContent');
    const story = document.getElementById('activityStory');
    const $ = id => document.getElementById(id);
    function todayTaipei(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
    function safeUrl(raw){if(!raw)return '';try{const u=new URL(raw,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
    function state(item){const d=todayTaipei();return item.end_date<d?'活動已結束':item.start_date>d?'即將開始':'活動中';}
    function dateText(value){if(!value)return '尚未提供';const [y,m,d]=value.slice(0,10).split('-');return `${y}.${m}.${d}`;}
    function mapsUrl(query){const u=new URL('https://www.google.com/maps');u.searchParams.set('q',query);return u.href;}
    function mapsEmbedUrl(query){const u=new URL('https://www.google.com/maps');u.searchParams.set('q',query);u.searchParams.set('z','17');u.searchParams.set('output','embed');return u.href;}
    function setInfo(id,value){$(id).textContent=value||'尚未提供';}
    let imageDialog;
    function openActivityImage(src,alt){
      if(!imageDialog){
        imageDialog=document.createElement('dialog');imageDialog.className='activity-image-dialog';imageDialog.setAttribute('aria-label','活動圖片放大檢視');
        const close=document.createElement('button');close.type='button';close.className='activity-image-close';close.textContent='關閉';close.onclick=()=>imageDialog.close();
        const picture=document.createElement('img');imageDialog.append(close,picture);document.body.append(imageDialog);
        imageDialog.onclick=event=>{if(event.target!==imageDialog)return;const r=imageDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)imageDialog.close();};
      }
      const picture=imageDialog.querySelector('img');picture.src=src;picture.alt=alt;imageDialog.showModal();
    }
    function addStory(item){
      if(item.cover_image){const figure=document.createElement('figure');figure.className='story-img activity-story-img';figure.dataset.imageFit=item.cover_image_fit==='cover'?'cover':'contain';const img=document.createElement('img');img.src=safeUrl(item.cover_image);img.alt=item.title||'活動圖片';img.loading='lazy';const enlarge=document.createElement('button');enlarge.type='button';enlarge.className='activity-image-enlarge';enlarge.setAttribute('aria-label','放大活動圖片：'+(item.title||''));enlarge.append(img);enlarge.onclick=()=>openActivityImage(img.src,img.alt);figure.append(enlarge);story.append(figure);if(item.cover_image_source){const cap=document.createElement('p');cap.className='image-source-caption';cap.textContent='圖片來源：'+item.cover_image_source;story.append(cap);}}
      if(item.content){const content=document.createElement('div');content.className='detail-prose activity-detail-content';content.textContent=item.content;story.append(content);}
      if(!item.cover_image&&!item.content)story.hidden=true;
    }
    function render(item){
      document.title=`${item.title}｜北投近期活動｜北投旅圖`;
      const category=document.createElement('p');category.className='activity-category';category.textContent=item.category||'在地活動';
      const title=document.createElement('h1');title.textContent=item.title||'在地活動';
      const badge=document.createElement('span');const label=state(item);badge.className='event-status '+(label==='活動中'?'ongoing':label==='活動已結束'?'ended':'upcoming');badge.textContent=label;
      const meta=document.createElement('div');meta.className='activity-detail-meta';meta.append(badge,document.createTextNode(`${dateText(item.start_date)} – ${dateText(item.end_date)}${item.hours?'｜'+item.hours:''}`));
      hero.replaceChildren(category,title,meta);
      $('activityBreadcrumb').textContent=`首頁 〉 近期活動 〉 ${item.title||'活動資訊'}`;
      if(item.summary){$('activityLead').textContent=item.summary;}else $('activityLead').hidden=true;
      addStory(item);
      setInfo('infoDates',`${dateText(item.start_date)} – ${dateText(item.end_date)}`);
      setInfo('infoHours',item.hours);setInfo('infoVenue',item.venue_name);setInfo('infoAddress',item.address);setInfo('infoAdmission',item.admission);setInfo('infoCategory',item.category);
      const query=[item.venue_name,item.address].filter(Boolean).join(' ')||item.title||'';
      const mapUrl=safeUrl(item.google_map)||mapsUrl(query);
      $('activityMapButton').href=mapUrl;
      $('activityMapButton').hidden=!query;
      if(query){$('activityMap').src=mapsEmbedUrl(query);$('activityMapFrame').hidden=false;}
      const official=safeUrl(item.official_url);if(official){$('activityOfficialButton').href=official;$('activityOfficialButton').hidden=false;}
      MetroTransportGuide.render($('activityTransportGuide'),item,{destination:[item.title,item.venue_name,item.address].filter(Boolean).join(' ')});
      renderRelatedReading(item,document.getElementById('related'),'events');
      $('activityShare').addEventListener('click',async()=>{const payload={title:item.title||'北投近期活動',url:location.href};try{if(navigator.share)await navigator.share(payload);else{await navigator.clipboard.writeText(location.href);alert('活動連結已複製');}}catch(_){}});
    }
    async function load(){
      const id=new URLSearchParams(location.search).get('id');if(!id){hero.textContent='找不到活動編號。';return;}
      try{const q=new URLSearchParams({select:'*',id:`eq.${id}`,is_published:'eq.true',limit:'1'});const r=await fetch(`${SUPABASE_URL}/rest/v1/events?${q}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!r.ok)throw Error(`讀取失敗 ${r.status}`);const rows=await r.json(),item=rows[0];if(!item||item.end_date<todayTaipei()&&item.end_behavior!=='show_ended'){hero.textContent='這筆活動目前沒有公開，或已結束。';return;}render(item);}catch(error){console.error(error);hero.textContent='目前無法載入活動資料，請稍後再試。';}
    }
    load();
  </script>
</body>
</html>
