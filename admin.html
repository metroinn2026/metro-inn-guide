<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CMS管理後台｜Metro Inn Guide</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="kicker">METRO INN GUIDE</div>
        <div class="brand-title">北投旅圖 CMS</div>
      </div>
      <nav class="side-nav" id="sideNav">
        <a class="active" data-table="news">最新消息</a>
        <a data-table="spots">景點管理</a>
        <a data-table="foods">美食管理</a>
        <a data-table="trips">行程管理</a>
        <a data-table="coupons">優惠管理</a>
      </nav>
      <div class="side-bottom">
        <a class="button" href="index.html" target="_blank">開啟前台預覽 ↗</a>
        <button onclick="logout()">登出</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="kicker">ADMIN CENTER</p>
          <h1>Metro Inn Guide｜內容管理中心</h1>
        </div>
        <div>
          <span id="userEmail">檢查登入中...</span>
        </div>
      </header>

      <section class="notice">
        後台已串接 Supabase。新增、編輯、上架／下架後，前台頁面會直接讀取最新資料。
        第一次使用前，請先完成我提供的 SQL 權限設定。
      </section>

      <section id="editorPanel" class="panel active">
        <div class="panel-head">
          <div>
            <p class="kicker" id="currentKicker">NEWS</p>
            <h2 id="currentTitle">最新消息管理</h2>
          </div>
          <div class="actions">
            <button class="primary" onclick="newItem()">新增</button>
            <button onclick="loadCurrentTable()">重新讀取</button>
          </div>
        </div>

        <div class="toolbar">
          <input id="searchInput" placeholder="搜尋標題、摘要、內容..." oninput="renderList()">
          <select id="statusFilter" onchange="renderList()">
            <option value="all">全部狀態</option>
            <option value="published">已上架</option>
            <option value="draft">草稿 / 下架</option>
          </select>
        </div>

        <div class="grid two">
          <div class="card">
            <h3 id="formTitle">新增內容</h3>
            <div id="formFields"></div>
            <div class="actions">
              <button class="primary" onclick="saveItem()">儲存</button>
              <button onclick="clearForm()">清空</button>
              <a id="previewLink" class="button" href="#" target="_blank" style="display:none">前台預覽</a>
            </div>
            <p id="formMsg" class="msg"></p>
          </div>

          <div class="table-card">
            <table>
              <thead>
                <tr>
                  <th>標題</th>
                  <th>日期 / 地區</th>
                  <th>狀態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="listBody">
                <tr><td colspan="4">資料載入中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const configs = {
      news: {
        label:'最新消息', kicker:'NEWS', preview:'news-detail.html?id=',
        fields:[
          ['id','ID','text','auto'],
          ['slug','網址代稱 slug','text'],
          ['title','標題','text','required'],
          ['summary','摘要','textarea'],
          ['content','內文','textarea'],
          ['cover_image','封面圖網址','text'],
          ['publish_date','發布日期','date'],
          ['event_name','活動名稱','text'],
          ['event_date','活動日期','text'],
          ['event_address','活動地點（地址）','text'],
          ['phone','電話','text'],
          ['event_content','活動內容','textarea'],
          ['remark','備註','textarea'],
          ['is_published','狀態','boolean']
        ],
        subtitle:(x)=>x.publish_date || x.event_date || '-'
      },
      spots: {
        label:'景點管理', kicker:'SPOTS', preview:'spot.html?id=',
        fields:[
          ['id','ID','text','auto'],
          ['slug','網址代稱 slug','text'],
          ['title','景點名稱','text','required'],
          ['area','地區','text'],
          ['station','最近捷運站','text'],
          ['summary','摘要','textarea'],
          ['content','介紹內容','textarea'],
          ['address','地址','text'],
          ['business_hours','營業時間','text'],
          ['stay_time','建議停留','text'],
          ['tags','標籤','text'],
          ['google_map','Google Map連結','text'],
          ['official_website','官方網站','text'],
          ['cover_image','封面圖網址','text'],
          ['is_published','狀態','boolean']
        ],
        subtitle:(x)=>x.area || x.station || '-'
      },
      foods: {
        label:'美食管理', kicker:'FOODS', preview:'food.html?id=',
        fields:[
          ['id','ID','text','auto'],
          ['slug','網址代稱 slug','text'],
          ['title','店名','text','required'],
          ['category','類型','text'],
          ['address','地址','text'],
          ['business_hours','營業時間','text'],
          ['phone','電話','text'],
          ['average_cost','平均消費','text'],
          ['price_range','價格區間','text'],
          ['tags','標籤','text'],
          ['google_map','Google Map連結','text'],
          ['official_website','官方網站','text'],
          ['summary','摘要','textarea'],
          ['content','介紹內容','textarea'],
          ['cover_image','封面圖網址','text'],
          ['is_published','狀態','boolean']
        ],
        subtitle:(x)=>x.category || x.average_cost || '-'
      },
      trips: {
        label:'行程管理', kicker:'TRIPS', preview:'trip.html?id=',
        fields:[
          ['id','ID','text','auto'],
          ['slug','網址代稱 slug','text'],
          ['title','行程名稱','text','required'],
          ['duration','建議時間','text'],
          ['summary','摘要','textarea'],
          ['content','行程內容（方案B格式）','textarea'],
          ['google_route','Google路線','text'],
          ['cover_image','封面圖網址','text'],
          ['is_published','狀態','boolean']
        ],
        subtitle:(x)=>x.duration || '-'
      },
      coupons: {
        label:'優惠管理', kicker:'COUPONS', preview:'coupon.html?id=',
        fields:[
          ['id','ID','text','auto'],
          ['slug','網址代稱 slug','text'],
          ['title','優惠名稱','text','required'],
          ['summary','摘要','textarea'],
          ['content','優惠內容','textarea'],
          ['start_date','開始日期','date'],
          ['end_date','結束日期','date'],
          ['official_website','連結網址','text'],
          ['cover_image','封面圖網址','text'],
          ['is_published','狀態','boolean']
        ],
        subtitle:(x)=>(x.start_date || '-') + ' ~ ' + (x.end_date || '-')
      }
    };

    let currentTable = 'news';
    let cache = [];
    let editingId = '';

    async function checkLogin(){
      const { data } = await db.auth.getSession();
      if(!data.session){
        location.href = 'admin-login.html';
        return;
      }
      document.getElementById('userEmail').textContent = data.session.user.email;
      buildForm();
      loadCurrentTable();
    }

    async function logout(){
      await db.auth.signOut();
      location.href='admin-login.html';
    }

    document.querySelectorAll('#sideNav a').forEach(a=>{
      a.addEventListener('click',()=>{
        document.querySelectorAll('#sideNav a').forEach(x=>x.classList.remove('active'));
        a.classList.add('active');
        currentTable = a.dataset.table;
        document.getElementById('currentKicker').textContent = configs[currentTable].kicker;
        document.getElementById('currentTitle').textContent = configs[currentTable].label;
        editingId = '';
        buildForm();
        loadCurrentTable();
      });
    });

    function buildForm(){
      const cfg = configs[currentTable];
      const wrap = document.getElementById('formFields');
      wrap.innerHTML = cfg.fields.map(([name,label,type,flag])=>{
        if(type === 'textarea'){
          return `<div class="form-row"><label>${label}</label><textarea id="f_${name}" rows="5"></textarea></div>`;
        }
        if(type === 'boolean'){
          return `<div class="form-row"><label>${label}</label><select id="f_${name}"><option value="true">已上架</option><option value="false">草稿 / 下架</option></select></div>`;
        }
        return `<div class="form-row"><label>${label}</label><input id="f_${name}" type="${type}" ${flag==='auto'?'readonly':''}></div>`;
      }).join('');
      clearForm();
    }

    function nextId(){
      const prefix = currentTable === 'news' ? 'news' :
        currentTable === 'spots' ? 'spot' :
        currentTable === 'foods' ? 'food' :
        currentTable === 'trips' ? 'trip' : 'coupon';
      const nums = cache.map(x=>String(x.id||'').replace(prefix+'_','')).map(n=>parseInt(n,10)).filter(n=>!isNaN(n));
      const next = nums.length ? Math.max(...nums)+1 : 1;
      return `${prefix}_${String(next).padStart(4,'0')}`;
    }

    function slugify(text){
      return String(text||'').trim().toLowerCase()
        .replace(/[^\w\u4e00-\u9fa5]+/g,'-')
        .replace(/^-+|-+$/g,'') || `${currentTable}-${Date.now()}`;
    }

    function clearForm(){
      editingId = '';
      document.getElementById('formTitle').textContent = '新增內容';
      document.getElementById('formMsg').textContent = '';
      document.getElementById('previewLink').style.display = 'none';
      configs[currentTable].fields.forEach(([name,label,type])=>{
        const el = document.getElementById('f_'+name);
        if(!el) return;
        if(name==='id') el.value = nextId();
        else if(name==='is_published') el.value = 'true';
        else if(type==='date' && (name==='publish_date')) el.value = new Date().toISOString().slice(0,10);
        else el.value = '';
      });
    }

    function newItem(){ clearForm(); window.scrollTo({top:0,behavior:'smooth'}); }

    async function loadCurrentTable(){
      const tbody = document.getElementById('listBody');
      tbody.innerHTML = '<tr><td colspan="4">資料載入中...</td></tr>';

      const orderCol = currentTable === 'news' ? 'publish_date' : 'id';
      const { data, error } = await db.from(currentTable).select('*').order(orderCol, { ascending:false });
      if(error){
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="4">讀取失敗：${error.message}</td></tr>`;
        return;
      }
      cache = data || [];
      renderList();
      clearForm();
    }

    function renderList(){
      const keyword = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('statusFilter').value;
      let list = cache.filter(item=>{
        const text = JSON.stringify(item);
        const matchKeyword = !keyword || text.includes(keyword);
        const matchStatus =
          status==='all' ||
          (status==='published' && item.is_published) ||
          (status==='draft' && !item.is_published);
        return matchKeyword && matchStatus;
      });

      const tbody = document.getElementById('listBody');
      if(!list.length){
        tbody.innerHTML = '<tr><td colspan="4">沒有符合條件的資料。</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(item=>`
        <tr>
          <td><strong>${item.title || item.id}</strong><br><small>${item.id}</small></td>
          <td>${configs[currentTable].subtitle(item)}</td>
          <td><span class="status ${item.is_published?'on':'draft'}">${item.is_published?'已上架':'草稿'}</span></td>
          <td>
            <div class="actions">
              <button onclick="editItem('${item.id}')">編輯</button>
              <button onclick="toggleItem('${item.id}')">${item.is_published?'下架':'上架'}</button>
              <button class="danger" onclick="deleteItem('${item.id}')">刪除</button>
              <a class="button" target="_blank" href="${configs[currentTable].preview}${encodeURIComponent(item.id)}">預覽</a>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function editItem(id){
      const item = cache.find(x=>x.id===id);
      if(!item) return;
      editingId = id;
      document.getElementById('formTitle').textContent = '編輯內容';
      configs[currentTable].fields.forEach(([name,label,type])=>{
        const el = document.getElementById('f_'+name);
        if(!el) return;
        if(type==='boolean') el.value = item[name] ? 'true' : 'false';
        else el.value = item[name] ?? '';
      });
      const link = document.getElementById('previewLink');
      link.href = configs[currentTable].preview + encodeURIComponent(id);
      link.style.display = 'inline-flex';
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function formPayload(){
      const payload = {};
      configs[currentTable].fields.forEach(([name,label,type])=>{
        const el = document.getElementById('f_'+name);
        if(!el) return;
        if(type==='boolean') payload[name] = el.value === 'true';
        else payload[name] = el.value.trim();
      });
      if(!payload.id) payload.id = nextId();
      if(!payload.slug && payload.title) payload.slug = slugify(payload.title);
      Object.keys(payload).forEach(k=>{ if(payload[k]==='') payload[k]=null; });
      return payload;
    }

    async function saveItem(){
      const msg = document.getElementById('formMsg');
      const payload = formPayload();
      if(!payload.title){
        msg.textContent = '請輸入標題 / 名稱。';
        return;
      }
      msg.textContent = '儲存中...';

      const { error } = await db.from(currentTable).upsert(payload, { onConflict:'id' });
      if(error){
        console.error(error);
        msg.textContent = '儲存失敗：' + error.message;
        return;
      }
      msg.textContent = '已儲存。';
      await loadCurrentTable();
      editItem(payload.id);
    }

    async function toggleItem(id){
      const item = cache.find(x=>x.id===id);
      if(!item) return;
      const { error } = await db.from(currentTable).update({is_published:!item.is_published}).eq('id',id);
      if(error){ alert('更新失敗：' + error.message); return; }
      await loadCurrentTable();
    }

    async function deleteItem(id){
      if(!confirm('確定要刪除這筆資料嗎？')) return;
      const { error } = await db.from(currentTable).delete().eq('id',id);
      if(error){ alert('刪除失敗：' + error.message); return; }
      await loadCurrentTable();
    }

    checkLogin();
  </script>
</body>
</html>
