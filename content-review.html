<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>內容審核中心｜北投旅圖</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{max-width:none;margin:auto;padding:16px;color:#333;background:#fff}body.embedded .standalone-back{display:none}section{border:1px solid #ddd;padding:18px;margin:18px 0;background:#fff}button,select,input,textarea{padding:9px;margin:5px}textarea{width:100%;min-height:80px}button{cursor:pointer}.muted{color:#666}.row{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.row>*{max-width:100%}.item{border-top:1px solid #ddd;padding:15px 0}.hide{display:none}.badge{background:#e5f2f7;padding:5px}.preview{width:100%;height:65vh;border:1px solid #ddd}.review-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(290px,1fr);gap:16px}.review-controls{min-width:0}.sticky-actions{position:sticky;bottom:0;background:white;padding:10px 0;display:flex;gap:8px;border-top:1px solid #ddd}@media(max-width:800px){.review-layout{grid-template-columns:1fr}.preview{height:50vh}}label{display:block;margin:8px 0}.item button{margin-right:8px}
/* Phase 3.1: consistent control alignment inside the embedded admin workspace. */
*,*::before,*::after{box-sizing:border-box}
body.embedded{padding:0;background:transparent}
body.embedded>h1{display:none}
body.embedded>p.muted{margin:8px 0 12px}
body.embedded section{margin:14px 0;padding:18px;border-color:#d6e2f2;border-radius:10px}
body.embedded section:first-of-type{margin-top:0}
body.embedded #app{min-width:0}
body.embedded .row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
body.embedded .row>label{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:6px;margin:0;line-height:1.35;font-size:13px;color:#52647a;font-weight:600}
body.embedded .row>label select,body.embedded .row>label input{margin:0;min-height:40px;height:40px;font-size:14px;font-weight:400;color:#27364a}
body.embedded .row>button{height:40px;min-height:40px;margin:0;white-space:nowrap;align-self:flex-end}
body.embedded #category{min-width:125px}
body.embedded #filter{min-width:110px}
body.embedded #search{width:min(270px,100%)}
body.embedded #reviewSection>.row,body.embedded body>.row{margin:12px 0 16px}
body.embedded #detail .row{align-items:center}
body.embedded #detail .row>button{align-self:center}
body.embedded .review-controls>label{margin:10px 0;line-height:1.5}
body.embedded #publishLabel{display:flex;align-items:center;gap:8px}
body.embedded #publishLabel input{margin:0}
body.embedded .sticky-actions{align-items:center;flex-wrap:wrap}
body.embedded .sticky-actions button{margin:0;min-height:40px}
body.embedded #file{margin:8px 8px 8px 0;max-width:100%}
@media(max-width:650px){body.embedded .row{align-items:stretch}body.embedded .row>label{flex:1 1 150px}body.embedded #search{width:100%}body.embedded .row>button{align-self:stretch}}
</style></head><body><a class="standalone-back" href="admin.html">← 返回管理後台</a><h1>內容審核中心</h1><div class="row"><label>內容分類 <select id="category"><option value="spots">景點</option><option value="foods">美食</option></select></label><button id="reviewTab" type="button">官方資料審稿</button><button id="importTab" type="button">批次匯入</button></div><p class="muted">匯入資料全部預設未公開；審核通過後才可上架。完整預覽只限已登入的管理員。</p><p id="notice" role="status">確認登入中…</p><div id="app" class="hide"><section id="importSection" class="hide"><h2>批次匯入 JSON</h2><p>接受 UTF-8 JSON 陣列；欄位使用目前所選分類的資料表欄位名稱。每筆須有名稱 title；有 id 時更新相同 ID，無 id 時自動編號。不刪除原資料，不接受以匯入資料直接上架。</p><input id="file" type="file" accept=".json,application/json"><button id="import">檢查並匯入草稿</button><p id="importMsg" role="status"></p></section><section id="reviewSection"><h2>官方資料審稿清單</h2><div class="row"><label>狀態 <select id="filter"><option value="pending">待審核</option><option value="needs_changes">待補件</option><option value="approved">已通過</option><option value="all">全部</option></select></label><label>搜尋 <input id="search" placeholder="名稱、ID、地區／類別"></label><button id="reload">重新整理</button></div><div id="items"></div></section><section id="detail" class="hide"><button id="backReview" type="button">← 返回審稿清單</button><div class="review-layout"><div class="review-preview"><h3>完整網頁預覽</h3><iframe id="frame" class="preview" title="完整預覽" loading="lazy"></iframe></div><div class="review-controls"><h2 id="detailTitle">景點審稿</h2><div class="row"><button id="preview">另開完整預覽 ↗</button><button id="edit" type="button">返回後台編輯</button></div><p>資料來源（每行一筆；請逐一核對）</p><textarea id="sources" placeholder="https://..."></textarea><label>審稿備註 <textarea id="note"></textarea></label><label>審稿狀態 <select id="status"><option value="pending">待審核</option><option value="needs_changes">待補件</option><option value="approved">已通過</option></select></label><label id="publishLabel"><input type="checkbox" id="publish">審核通過並公開上架</label><div class="sticky-actions"><button id="prev" type="button">上一筆</button><button id="save">儲存審核結果</button><button id="next" type="button">下一筆</button></div><p id="saveMsg" role="status"></p></div></div></section></div><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let rows=[],selected=null,category='spots';if(new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');const allowed=['id','sort_order','slug','title','area','station','summary','content','address','business_hours','stay_time','tags','google_map','official_website','cover_image','cover_image_source','transport_metro','transport_bus','transport_car'];function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='admin-login.html';return;}const {data:profile,error}=await db.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();if(error||!['admin','super_admin'].includes(profile?.role)){$('notice').textContent='沒有管理員權限。';return;}$('app').classList.remove('hide');await load();const id=new URLSearchParams(location.search).get('id');if(id)choose(id);}async function load(){$('notice').textContent='讀取中…';const {data,error}=await db.from(category).select('*').order('sort_order',{ascending:true}).limit(1000);if(error){$('notice').textContent='讀取失敗：'+error.message;return;}rows=data||[];$('notice').textContent='已讀取 '+rows.length+' 筆（最多 1000 筆）。';render();}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=rows.filter(r=>(f==='all'||(r.review_status||'pending')===f)&&(!q||[r.id,r.title,r.area,r.category].join(' ').toLowerCase().includes(q)));$('items').replaceChildren();if(!list.length){$('items').append(node('p','沒有符合的資料。'));return;}for(const r of list){const box=node('div');box.className='item';box.append(node('strong',r.title||'未命名'),node('p',`${r.id}｜${(category==='spots'?r.area:r.category)||'未指定分類'}｜${r.review_status||'pending'}｜${r.is_published?'已上架':'未公開'}`));const b=node('button','審稿／完整預覽');b.onclick=()=>choose(r.id);box.append(b);$('items').append(box);}}function choose(id){selected=rows.find(r=>r.id===id);if(!selected)return;$('detail').classList.remove('hide');$('reviewSection').classList.add('hide');$('detailTitle').textContent='審稿：'+selected.title;$('sources').value=selected.source_urls||'';$('note').value=selected.review_note||'';$('status').value=selected.review_status||'pending';$('publish').checked=!!selected.is_published;$('publish').disabled=$('status').value!=='approved';$('edit').onclick=()=>{if(window.parent!==window)window.parent.postMessage({type:'metro-edit',table:category,id:selected.id},location.origin);else location.href='admin.html';};$('frame').src=(category==='spots'?'spot.html?id=':'food.html?id=')+encodeURIComponent(id)+'&admin_preview=1';$('saveMsg').textContent='';window.scrollTo({top:0,behavior:'smooth'});} $('preview').onclick=()=>{if(selected)window.open((category==='spots'?'spot.html?id=':'food.html?id=')+encodeURIComponent(selected.id)+'&admin_preview=1','_blank','noopener');};$('save').onclick=async()=>{if(!selected)return;const status=$('status').value,published=status==='approved'&&$('publish').checked;if(published&&status!=='approved'){$('saveMsg').textContent='公開前必須審核通過。';return;}if(published&&!confirm('已核對內容、來源、圖片授權，確定公開？'))return;$('save').disabled=true;const {data:{user}}=await db.auth.getUser();const {data,error}=await db.from(category).update({review_status:status,source_urls:$('sources').value.trim(),review_note:$('note').value.trim(),is_published:published,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',selected.id).select('id');$('save').disabled=false;if(error||!data?.length){$('saveMsg').textContent='儲存失敗：'+(error?.message||'沒有更新到資料');return;}$('saveMsg').textContent='審稿結果已儲存。';const id=selected.id;await load();choose(id);};$('import').onclick=async()=>{const file=$('file').files[0];if(!file){$('importMsg').textContent='請選擇 JSON 檔。';return;}let records;try{records=JSON.parse(await file.text());if(!Array.isArray(records)||!records.length||records.length>100)throw Error('單次須為 1～100 筆 JSON 陣列。');if(records.some(r=>!r||typeof r!=='object'||Array.isArray(r)||!String(r.title||'').trim()))throw Error('每筆都必須有 title。');}catch(e){$('importMsg').textContent='檔案格式錯誤：'+e.message;return;}if(!confirm('匯入 '+records.length+' 筆'+(category==='spots'?'景點':'美食')+'草稿？同 ID 會更新且下架，不會刪除其他資料。'))return;$('import').disabled=true;$('importMsg').textContent='匯入中…';const {data,error}=await db.rpc(category==='spots'?'import_spot_drafts':'import_food_drafts',{p_records:records});$('import').disabled=false;if(error){$('importMsg').textContent='匯入失敗：'+error.message;return;}$('importMsg').textContent='匯入完成：'+data+' 筆。';await load();};$('category').onchange=async()=>{category=$('category').value;selected=null;$('detail').classList.add('hide');$('filter').value='pending';await load();};
$('backReview').onclick=()=>{$('detail').classList.add('hide');$('reviewSection').classList.remove('hide');};$('reviewTab').onclick=()=>{$('reviewSection').classList.remove('hide');$('importSection').classList.add('hide');$('detail').classList.add('hide');};
$('importTab').onclick=()=>{$('reviewSection').classList.add('hide');$('detail').classList.add('hide');$('importSection').classList.remove('hide');};
$('status').onchange=()=>{if($('status').value!=='approved')$('publish').checked=false;$('publish').disabled=$('status').value!=='approved';};
$('prev').onclick=()=>{const i=rows.findIndex(r=>r.id===selected?.id);if(i>0)choose(rows[i-1].id);};
$('next').onclick=()=>{const i=rows.findIndex(r=>r.id===selected?.id);if(i>=0&&i<rows.length-1)choose(rows[i+1].id);};
$('filter').onchange=render;$('search').oninput=render;$('reload').onclick=load;init();
</script></body></html>
