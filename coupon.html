<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>優惠介紹｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css?v=20261003-reading-spacing">
  <script src="data.js"></script>
  <script src="related-reading.js?v=20261003-auto-reading"></script>
  <script src="supabase-config.js"></script>
</head>
<body id="top" class="coupon-detail-page">
  <div id="header"></div>

  <section class="crumb">
    <div class="container">
      <div id="breadcrumb">首頁 〉 優惠介紹</div>
      <button class="share-icon" type="button" aria-label="分享此頁">⇪</button>
    </div>
  </section>

  <main class="container article-wrap single-point detail-no-sidebar">
    <article>
      <div id="storyMeta" class="meta detail-eyebrow">OFFER</div>
      <h1 id="articleTitle" class="spot-article-title">優惠名稱</h1>
      <p id="leadText" class="lead">優惠資料載入中...</p>

      <div class="tag-list">
        <span class="tag dark">優惠資訊</span>
        <span class="tag">旅遊推薦</span>
        <span class="tag">北捷行旅</span>
      </div>

      <section class="story">
        <div class="story-img">
          <img id="storyImage" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85" alt="">
        </div>
        <p id="storyImageSource" class="image-source-caption"></p>
        <div id="storyContent" class="detail-prose">優惠資料載入中...</div>
      </section>

      <section id="info" class="info-card point-info">
        <div class="info-head-row">
          <div>
            <div class="kicker">INFORMATION</div>
            <h3 id="infoTitle">優惠資訊</h3>
          </div>
          <button class="share-mini" type="button" aria-label="分享優惠">⇪</button>
        </div>

        <div class="info-row"><span class="info-label">優惠名稱</span><span id="infoName">尚未提供</span></div>
        <div class="info-row"><span class="info-label">開始日期</span><span id="infoStart">尚未提供</span></div>
        <div class="info-row"><span class="info-label">結束日期</span><span id="infoEnd">尚未提供</span></div>
        <div class="info-row"><span class="info-label">使用說明</span><span id="infoSummary">尚未提供</span></div>
        <div class="info-row"><span class="info-label">備註</span><span>實際優惠內容、使用限制與活動期間，請以官方或合作店家公告為準。</span></div>

        <div class="info-actions multi">
          <a id="officialButton" class="button" href="#" target="_blank" rel="noopener">前往查看</a>
          <a class="button outline" href="coupons.html">回優惠目錄</a>
        </div>
      </section>
    </article>

    
  </main>

  <section id="related" class="section related" hidden></section>
  <div id="footer"></div>

  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const fallbackImage = 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85';

    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function setText(id, value, fallback = '尚未提供') {
      const el = document.getElementById(id);
      if (el) el.textContent = value || fallback;
    }

    function dateRange(coupon) {
      if (coupon.start_date && coupon.end_date) return `${coupon.start_date} - ${coupon.end_date}`;
      return coupon.start_date || coupon.end_date || '依公告為準';
    }

    function renderImageCaption(text){
      const el = document.getElementById('storyImageSource');
      if(!el) return;
      const raw = (text || '').trim();
      if(!raw){
        el.textContent = '';
        el.style.display = 'none';
        return;
      }
      el.textContent = raw.startsWith('圖片來源') ? raw : `圖片來源：${raw}`;
      el.style.display = 'block';
    }



    async function loadCoupon() {
      const id = getParam('id');

      if (!id) {
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/coupons?id=eq.${encodeURIComponent(id)}&select=*`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Supabase 讀取失敗');

        const coupon = result[0];

        if (!coupon) {
          return;
        }

        const title = coupon.title || '優惠介紹';
        const summary = coupon.summary || '更多優惠說明即將補上。';
        const content = coupon.content || summary;
        const image = coupon.cover_image || fallbackImage;
        const imageSourceText = coupon.cover_image_source || coupon.image_source || '';

        document.title = `${title}｜Metro Inn Guide 北投旅圖`;

        document.getElementById('storyImage').src = image;
        renderImageCaption(imageSourceText);
        document.getElementById('storyImage').alt = title;

        renderBreadcrumb('優惠介紹', 'coupons.html', title);
        renderRelatedReading(coupon,document.getElementById('related'),'coupons');
        setText('articleTitle', title);
        setText('leadText', summary);
        setText('storyMeta', (coupon.slug || 'offer').replaceAll('-', ' ').toUpperCase());
        setText('storyContent', content);

        setText('infoTitle', `${title}優惠資訊`);
        setText('infoName', title);
        setText('infoStart', coupon.start_date);
        setText('infoEnd', coupon.end_date);
        setText('infoSummary', summary);




        document.getElementById('officialButton').href = coupon.official_website || 'coupons.html';

      } catch (error) {
        console.error(error);
        setText('leadText', '優惠資料暫時無法載入，請稍後再試。');
      }
    }

    loadCoupon();
  </script>
</body>
</html>
