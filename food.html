<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美食介紹｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="related-reading.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="transit-duration.js"></script>
<script src="transport-guide.js?v=20261002-shared-all-details"></script>
</head>

<body id="top" class="food-detail-page">
  <div id="header"></div>

  <section class="hero">
    <img id="heroImage" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=85" alt="">
    <div class="container">
      <div class="hero-content">
        <div id="heroKicker" class="kicker">FOOD DETAIL</div>
        <h1 id="heroTitle">美食介紹</h1>
        <p id="heroSubtitle">美食資料載入中...</p>
        <div class="hero-icons">
          <span id="heroCategory">美食類型</span>
          <span id="heroHours">營業時間</span>
          <span id="heroCost">平均消費</span>
          <span id="heroTags">美食標籤</span>
        </div>
      </div>
    </div>
  </section>

  <section class="crumb">
    <div class="container">
      <div id="breadcrumb">首頁 〉 美食介紹</div>
      <button class="share-icon" type="button" aria-label="分享此頁">⇪</button>
    </div>
  </section>

  <main class="container article-wrap single-point">
    <article>
      <div id="storyMeta" class="meta detail-eyebrow">FOOD</div>
      <h1 id="articleTitle" class="spot-article-title">美食名稱</h1>
      <p id="leadText" class="lead">美食資料載入中...</p>

      <div id="tagListTop" class="tag-list"></div>

      <section class="story">

        <div class="story-img">
          <img id="storyImage" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=85" alt="">
        </div>
        <p id="storyImageSource" class="image-source-caption"></p>
        <div id="storyContent" class="detail-prose">美食資料載入中...</div>
      </section>

      <section class="detail-map-frame" aria-labelledby="detailMapHeading">
        <h2 id="detailMapHeading">店家位置</h2>
        <iframe id="mapEmbed" class="map-embed small" loading="lazy" title="店家位置 Google 地圖" referrerpolicy="no-referrer-when-downgrade"></iframe>
        <p style="margin:10px 0 0;font-size:14px"><a id="mapEmbedFallback" href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">地圖無法顯示？在 Google Maps 開啟 ↗</a></p>
      </section>

      <section id="info" class="info-card point-info">
        <div class="info-head-row">
          <div>
            <div class="kicker">INFORMATION</div>
            <h3 id="infoTitle">美食資訊</h3>
          </div>
          <button class="share-mini" type="button" aria-label="分享美食">⇪</button>
        </div>

        <div class="info-row"><span class="info-label">類型</span><span id="infoCategory">尚未提供</span></div>
        <div class="info-row"><span class="info-label">地址</span><span id="infoAddress">尚未提供</span></div>
        <div class="info-row"><span class="info-label">營業時間</span><span id="infoHours">尚未提供</span></div>
        <div class="info-row"><span class="info-label">電話</span><span id="infoPhone">尚未提供</span></div>
        <div class="info-row"><span class="info-label">平均消費</span><span id="infoCost">尚未提供</span></div>
        <div class="info-row"><span class="info-label">標籤</span><span id="infoTags">尚未提供</span></div>
        <div id="infoNoteRow" class="info-row" hidden><span class="info-label">備註</span><span id="infoNote"></span></div>

        <div class="info-actions multi">
          <a id="officialButton" class="button outline" href="#" target="_blank" rel="noopener">官方網站</a>
        </div>


      </section>
    </article>

    <aside class="sticky-panel">
      <div id="foodTransportGuide"></div>
    </aside>
  </main>

  <section id="related" class="section related" hidden></section>

  <div id="footer"></div>

  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const fallbackImage = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=85';

    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags).split(/[、,，]/).map(tag => tag.trim()).filter(Boolean);
    }

    function setText(id, value, fallback = '尚未提供') {
      const el = document.getElementById(id);
      if (el) el.textContent = value || fallback;
    }

    // Use a Google Maps search embed rather than treating a shared Maps URL as an iframe URL.
    // A normal /maps/place or shortened sharing URL cannot be embedded directly.
    function mapCoordinates(item) {
      const latRaw = item.latitude ?? item.lat;
      const lonRaw = item.longitude ?? item.lng ?? item.lon;
      if (latRaw !== null && latRaw !== undefined && String(latRaw).trim() !== '' &&
          lonRaw !== null && lonRaw !== undefined && String(lonRaw).trim() !== '') {
        const lat = Number(latRaw), lon = Number(lonRaw);
        if (Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && (lat !== 0 || lon !== 0)) return [lat, lon];
      }
      const link = String(item.google_map || '');
      const patterns = [/[?&](?:q|query)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/, /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/];
      for (const pattern of patterns) {
        const match = link.match(pattern);
        if (match && Math.abs(Number(match[1])) <= 90 && Math.abs(Number(match[2])) <= 180) return [Number(match[1]), Number(match[2])];
      }
      return null;
    }
    function mapEmbedUrl(item) {
      // Prioritize the business address/name over the map viewport coordinates (@lat,lon),
      // which can point to the map center rather than the actual business.
      const query = [item.title || item.name, item.address].filter(Boolean).join(' ').trim();
      const coords = mapCoordinates(item);
      const location = query || (coords ? coords.join(',') : '');
      return location ? `https://maps.google.com/maps?output=embed&q=${encodeURIComponent(location)}&z=17` : '';
    }

    function renderImageCaption(text){
      const el = document.getElementById('storyImageSource');
      if(!el) return;
      const raw = (text || '').trim();
      if(!raw){
        el.textContent = '';
        el.style.display = 'none';
        return;
      }
      el.textContent = raw.startsWith('圖片來源') ? raw : `圖片來源：${raw}`;
      el.style.display = 'block';
    }



    function setupHotelRoutes(item) {
      MetroTransportGuide.render(
        document.getElementById('foodTransportGuide'),
        item,
        { destination: [item.title, item.address].filter(Boolean).join(' ') }
      );
    }


    async function loadFood() {
      const id = getParam('id');

      if (!id) {
        setText('heroSubtitle', '找不到美食代碼，請回美食列表重新進入。');
        return;
      }

      try {
        let previewFood = null;
        if(getParam('admin_preview')==='1'){
          const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
          const {data:{user}}=await client.auth.getUser();
          if(!user)throw new Error('草稿預覽須先登入管理員。');
          const {data:profile}=await client.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();
          if(!['admin','super_admin'].includes(profile?.role))throw new Error('沒有草稿預覽權限。');
          const {data,error}=await client.from('foods').select('*').eq('id',id).maybeSingle();
          if(error||!data)throw new Error('草稿讀取失敗，請檢查管理員權限。');
          previewFood=data;
          const banner=document.createElement('div');banner.textContent='管理員草稿預覽｜此頁未公開，請勿分享';
          banner.style.cssText='position:sticky;top:0;z-index:9999;padding:12px;text-align:center;background:#fff0bc;color:#543a00;font-weight:700';
          document.body.prepend(banner);
        }
        const response = previewFood ? null : await fetch(
          `${SUPABASE_URL}/rest/v1/foods?id=eq.${encodeURIComponent(id)}&is_published=eq.true&select=*`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = previewFood ? [previewFood] : await response.json();

        if (response && !response.ok) {
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        const food = result[0];

        if (!food) {
          setText('heroSubtitle', '找不到這筆美食資料。');
          return;
        }

        const tags = normalizeTags(food.tags);
        const image = food.cover_image || fallbackImage;
        const imageSourceText = food.cover_image_source || food.image_source || '';
        const title = food.title || '美食介紹';
        const summary = food.summary || '更多介紹即將補上。';
        const content = food.content || summary;
        const cost = food.average_cost || food.price_range || '依店家公告為準';

        document.title = `${title}｜Metro Inn Guide 北投旅圖`;

        document.getElementById('heroImage').src = image;
        document.getElementById('heroImage').alt = title;
        document.getElementById('storyImage').src = image;
        renderImageCaption(imageSourceText);
        document.getElementById('storyImage').alt = title;

        setText('heroKicker', `${food.category || 'FOOD'} · FOOD`);
        setText('heroTitle', title);
        setText('articleTitle', title);
        setText('heroSubtitle', summary);
        setText('heroCategory', food.category || '美食');
        setText('heroHours', food.business_hours || '營業時間依公告為準');
        setText('heroCost', cost);
        setText('heroTags', tags[0] || '美食');

        renderBreadcrumb('美食介紹', 'foods.html', title);
        setText('leadText', summary);
        setText('storyMeta', (food.slug || 'food').replaceAll('-', ' ').toUpperCase());
        setText('storyContent', content);

        setText('infoTitle', '美食資訊');
        setText('infoCategory', food.category);
        setText('infoAddress', food.address);
        setText('infoHours', food.business_hours || '依店家公告為準');
        setText('infoPhone', food.phone);
        setText('infoCost', cost);
        setText('infoTags', tags.join('、'));
        const noteRow = document.getElementById('infoNoteRow');
        const noteText = String(food.notes || '').trim();
        if (noteRow) noteRow.hidden = !noteText;
        setText('infoNote', noteText, '');

        setText('sideTitle', title);
        setText('sideHours', food.business_hours || '營業時間依公告為準');
        setText('sideCost', `平均消費 ${cost}`);
        setText('sideAddress', food.address || '地址請見 Google Map');

        renderRelatedReading(food,document.getElementById('related'));
        setupHotelRoutes(food);


        const tagHtml = tags.map((tag, index) =>
          `<span class="tag ${index === 0 ? 'dark' : ''}">${tag}</span>`
        ).join('');

        document.getElementById('tagListTop').innerHTML = tagHtml;
        const sideTags = document.getElementById('sideTags');
        if (sideTags) {
          sideTags.innerHTML = tags.slice(0, 3).map(tag =>
            `<span class="tag">${tag}</span>`
          ).join('');
        }

        const mapQuery = [title, food.address].filter(Boolean).join(' ').trim();
        const mapUrl = /^https:\/\/(?:www\.)?(?:google\.[^/]+|maps\.google\.[^/]+)\//i.test(String(food.google_map || '')) ? food.google_map : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery || title)}`;

        if (food.official_website) {
          document.getElementById('officialButton').href = food.official_website;
          document.getElementById('officialButton').style.display = '';
        } else {
          document.getElementById('officialButton').style.display = 'none';
        }

        const mapFrame = document.getElementById('mapEmbed');
        const embedUrl = mapEmbedUrl(food);
        const mapSection = mapFrame.closest('.detail-map-frame');
        mapFrame.title = `${title}位置地圖（Google Maps）`;
        if (embedUrl) {
          mapFrame.src = embedUrl;
          mapFrame.hidden = false;
        } else {
          mapFrame.removeAttribute('src');
          mapFrame.hidden = true;
        }
        // An iframe's cross-origin errors cannot be reliably detected in JavaScript.
        // Always provide an accessible direct link so the visitor never gets stuck.
        const fallbackLink = document.getElementById('mapEmbedFallback');
        fallbackLink.href = mapUrl;
        fallbackLink.textContent = embedUrl ? '地圖無法顯示？在 Google Maps 開啟 ↗' : '在 Google Maps 查看店家位置 ↗';
        if (mapSection) mapSection.hidden = false;

      } catch (error) {
        console.error(error);
        setText('heroSubtitle', '美食資料暫時無法載入，請稍後再試。');
        setText('leadText', '美食資料暫時無法載入，請稍後再試。');
      }
    }

    loadFood();
  </script>
</body>
</html>
