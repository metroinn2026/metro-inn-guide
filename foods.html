<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美食目錄｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body id="top">
  <div id="header"></div>

  <section class="directory-hero">
    <div class="container">
      <div class="kicker">FOOD DIRECTORY</div>
      <h1>美食目錄</h1>
      <p>美食與店家獨立成資料庫，服務只想找餐廳、小吃、咖啡或伴手禮的旅客。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-row">
        <div class="filter-pills">
          <a class="pill active" data-area="all">全部</a>
          <a class="pill" data-area="北投">北投</a>
          <a class="pill" data-area="新北投">新北投</a>
          <a class="pill" data-area="陽明山">陽明山</a>
          <a class="pill" data-area="士林">士林</a>
          <a class="pill" data-area="淡水">淡水</a>
        </div>
        <a class="section-link" href="index.html">回首頁搜尋 →</a>
      </div>

      <div id="foodsStatus" class="empty-state">美食資料載入中...</div>
      <div id="foodsGrid" class="directory-grid"></div>

      <div class="pagination">
        <span class="active">1</span>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const statusEl = document.getElementById('foodsStatus');
    const gridEl = document.getElementById('foodsGrid');
    let allFoods = [];

    const fallbackImage = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=85';

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags)
        .split(/[、,，]/)
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    function getArea(food) {
      const text = [
        food.category,
        food.address,
        food.summary,
        food.content,
        food.tags
      ].filter(Boolean).join(' ');

      if (text.includes('新北投')) return '新北投';
      if (text.includes('陽明山')) return '陽明山';
      if (text.includes('士林')) return '士林';
      if (text.includes('淡水')) return '淡水';
      if (text.includes('北投')) return '北投';
      return food.category || 'FOOD';
    }

    function renderFoods(foods) {
      gridEl.innerHTML = '';

      if (!foods.length) {
        statusEl.textContent = '目前沒有符合條件的美食資料。';
        statusEl.style.display = 'block';
        return;
      }

      statusEl.style.display = 'none';

      foods.forEach(food => {
        const tags = normalizeTags(food.tags).slice(0, 2);
        const image = food.cover_image || fallbackImage;
        const summary = food.summary || '更多介紹即將補上。';
        const meta = getArea(food).toUpperCase();
        const href = `food.html?id=${encodeURIComponent(food.id)}`;
        const hours = food.business_hours || '依店家公告為準';

        const card = document.createElement('a');
        card.className = 'directory-card';
        card.href = href;
        card.innerHTML = `
          <div class="directory-img">
            <img src="${image}" alt="${food.title || ''}">
          </div>
          <div class="directory-body">
            <div class="meta">${meta}</div>
            <h3>${food.title || '未命名美食'}</h3>
            <p>${summary}</p>
            <div class="tag-list small">
              ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <div class="hours-line">營業時間：${hours}</div>
            <span class="arrow">→</span>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    async function loadFoods() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/foods?is_published=eq.true&select=*&order=id.asc`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          console.error('Supabase error:', result);
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        allFoods = result;
        renderFoods(allFoods);
      } catch (error) {
        console.error(error);
        statusEl.textContent = '美食資料暫時無法載入，請稍後再試。';
      }
    }

    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(item => item.classList.remove('active'));
        pill.classList.add('active');

        const area = pill.dataset.area;

        if (area === 'all') {
          renderFoods(allFoods);
        } else {
          renderFoods(allFoods.filter(food => getArea(food).includes(area)));
        }
      });
    });

    loadFoods();
  </script>
</body>
</html>
