<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美食目錄｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body id="top">
  <div id="header"></div>

  <section class="directory-hero">
    <div class="container">
      <div class="kicker">FOOD DIRECTORY</div>
      <h1 id="directoryTitle">美食目錄</h1>
      <p id="directorySummary">美食與店家獨立成資料庫，服務只想找餐廳、小吃、咖啡或伴手禮的旅客。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-row">
        <div id="directoryFilters" class="filter-pills"></div>
        <a class="section-link" href="index.html">回首頁搜尋 →</a>
      </div>

      <div id="foodsStatus" class="empty-state">美食資料載入中...</div>
      <div id="foodsGrid" class="directory-grid"></div>

      <div class="pagination" aria-label="美食分頁"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="directory-pagination.js"></script>
<script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const statusEl = document.getElementById('foodsStatus');
    const gridEl = document.getElementById('foodsGrid');
    let allFoods = [];
    const defaultFilters = ['全部','北投','新北投','陽明山','士林','淡水'];

    const fallbackImage = 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=85';

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags)
        .split(/[、,，]/)
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    function getArea(food) {
      const text = [
        food.category,
        food.address,
        food.summary,
        food.content,
        food.tags
      ].filter(Boolean).join(' ');

      if (text.includes('新北投')) return '新北投';
      if (text.includes('陽明山')) return '陽明山';
      if (text.includes('士林')) return '士林';
      if (text.includes('淡水')) return '淡水';
      if (text.includes('北投')) return '北投';
      return food.category || 'FOOD';
    }

    function escapeHtml(value) { return String(value || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); }
    function parseDirectoryFilters(value) { const labels=String(value||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean); return labels.length?labels:defaultFilters; }
    function renderDirectoryFilters(labels) {
      const root=document.getElementById('directoryFilters');
      const normalized=labels[0]==='全部'?labels:['全部',...labels.filter(x=>x!=='全部')];
      root.innerHTML=normalized.map((label,index)=>`<button type="button" class="pill${index===0?' active':''}" data-filter="${escapeHtml(index===0?'all':label)}">${escapeHtml(label)}</button>`).join('');
      root.querySelectorAll('.pill').forEach(pill=>pill.addEventListener('click',()=>{root.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));pill.classList.add('active');const keyword=pill.dataset.filter;renderFoods(keyword==='all'?allFoods:allFoods.filter(food=>[food.category,food.address,food.summary,food.content,food.tags].filter(Boolean).join(' ').includes(keyword)));}));
    }
    async function loadDirectorySettings(){renderDirectoryFilters(defaultFilters);try{const response=await fetch(`${SUPABASE_URL}/rest/v1/site_settings?id=eq.1&select=foods_directory_title,foods_directory_summary,foods_directory_tags`,{cache:'no-store',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!response.ok)return;const settings=(await response.json())?.[0];if(!settings)return;if(settings.foods_directory_title)document.getElementById('directoryTitle').textContent=settings.foods_directory_title;if(settings.foods_directory_summary)document.getElementById('directorySummary').textContent=settings.foods_directory_summary;renderDirectoryFilters(parseDirectoryFilters(settings.foods_directory_tags));}catch(error){console.warn('美食目錄設定載入失敗，使用預設值。',error);}}

    function renderFoodsPage(foods) {
      gridEl.innerHTML = '';

      if (!foods.length) {
        statusEl.textContent = '目前沒有符合條件的美食資料。';
        statusEl.style.display = 'block';
        return;
      }

      statusEl.style.display = 'none';

      foods.forEach(food => {
        const tags = normalizeTags(food.tags).slice(0, 2);
        const image = food.cover_image || fallbackImage;
        const summary = food.summary || '更多介紹即將補上。';
        const meta = getArea(food).toUpperCase();
        const href = `food.html?id=${encodeURIComponent(food.id)}`;

        const card = document.createElement('a');
        card.className = 'directory-card';
        card.href = href;
        card.innerHTML = `
          <div class="directory-img">
            <img src="${image}" alt="${food.title || ''}">
          </div>
          <div class="directory-body">
            <div class="meta">${meta}</div>
            <h3>${food.title || '未命名美食'}</h3>
            <p>${summary}</p>
            <div class="tag-list small">
              ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <span class="arrow">→</span>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    const directoryPager = createDirectoryPager(document, renderFoodsPage);
    function renderFoods(items) { directoryPager.setRecords(items); }

    async function loadFoods() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/foods?is_published=eq.true&select=*&order=sort_order.asc,id.asc`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = await response.json();

        if (!response.ok) {
          console.error('Supabase error:', result);
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        allFoods = result;
        renderFoods(allFoods);
      } catch (error) {
        console.error(error);
        statusEl.textContent = '美食資料暫時無法載入，請稍後再試。';
      }
    }

    loadDirectorySettings();
    loadFoods();
  </script>
</body>
</html>
