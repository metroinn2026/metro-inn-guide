<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>最新消息｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body id="top" class="news-detail-page">
  <div id="header"></div>

  <div class="crumb">
    <div class="container">
      <div id="breadcrumb">首頁　›　最新消息</div>
      <button class="share-icon" type="button" aria-label="分享此頁">⇪</button>
    </div>
  </div>

  <main class="container article-wrap">
    <article>
      <div class="meta detail-eyebrow">NEWS</div>
      <h1 id="articleTitle" class="news-article-title">最新消息</h1>
      <time id="publishDate" class="news-publish-date">發布日期</time>
      <p id="leadText" class="lead">消息資料載入中...</p>
      <div id="newsContentBlocks" class="news-content-blocks" aria-live="polite"></div>

    </article>
  </main>

  <div id="footer"></div>

  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function setText(id, value, fallback = '尚未提供') {
      const el = document.getElementById(id);
      if (el) el.textContent = value || fallback;
    }

    function parseContentBlocks(value){
      const raw=String(value||'').trim();
      if(!raw)return [];
      try{
        const blocks=JSON.parse(raw);
        if(Array.isArray(blocks))return blocks;
      }catch{}
      return [{type:'text',text:raw,legacy:true}];
    }

    function renderContentBlocks(news){
      const root=document.getElementById('newsContentBlocks');
      const blocks=parseContentBlocks(news.content);
      root.replaceChildren();
      blocks.forEach(block=>{
        if(block?.type==='image'&&block.image){
          const figure=document.createElement('figure');
          figure.className='news-content-image';
          const img=document.createElement('img');
          img.src=block.image;
          img.alt=block.alt||news.title||'';
          figure.append(img);
          if(block.image_source){
            const caption=document.createElement('figcaption');
            caption.textContent=String(block.image_source).startsWith('圖片來源')?block.image_source:`圖片來源：${block.image_source}`;
            figure.append(caption);
          }
          root.append(figure);
        }else if(block?.type==='button'&&block.label&&block.href){
          const href=String(block.href).trim();
          if(!/^(https?:\/\/|\/|\.\.?\/)/i.test(href))return;
          const wrap=document.createElement('div');wrap.className='news-content-button';
          const link=document.createElement('a');link.className=block.style==='outline'?'button outline':'button';
          link.href=href;link.textContent=block.label;
          if(block.new_window!==false){link.target='_blank';link.rel='noopener noreferrer';}
          wrap.append(link);root.append(wrap);
        }else if(block?.text){
          const paragraph=document.createElement('div');
          paragraph.className='news-content-text';
          paragraph.textContent=block.text;
          root.append(paragraph);
        }
      });
      // 舊消息仍沿用原本的「純文字＋封面」呈現；新圖文段落不會強制插入封面。
      if(blocks.some(block=>block?.legacy)&&news.cover_image){
        const figure=document.createElement('figure');
        figure.className='news-content-image';
        const img=document.createElement('img');img.src=news.cover_image;img.alt=news.title||'';figure.append(img);
        const source=news.cover_image_source||news.image_source||'';
        if(source){const caption=document.createElement('figcaption');caption.textContent=String(source).startsWith('圖片來源')?source:`圖片來源：${source}`;figure.append(caption);}
        root.append(figure);
      }
    }


    async function loadNews() {
      const id = getParam('id');

      if (!id) {
        setText('leadText', '找不到消息代碼，請回最新消息列表重新進入。');
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/news?id=eq.${encodeURIComponent(id)}&select=*`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Supabase 讀取失敗');

        const news = result[0];

        if (!news) {
          setText('leadText', '找不到這筆最新消息。');
          return;
        }

        document.title = `${news.title || '最新消息'}｜Metro Inn Guide 北投旅圖`;
        setText('articleTitle', news.title);
        setText('publishDate', news.publish_date || '日期未設定');
        const dateEl=document.getElementById('publishDate');
        if(news.publish_date)dateEl.dateTime=news.publish_date;
        setText('breadcrumb', `首頁　›　最新消息　›　${news.title}`);
        setText('leadText', news.summary, '');
        document.getElementById('leadText').hidden=!String(news.summary||'').trim();
        renderContentBlocks(news);

      } catch (error) {
        console.error(error);
        setText('leadText', '最新消息資料暫時無法載入，請稍後再試。');
      }
    }

    loadNews();
  </script>
</body>
</html>
