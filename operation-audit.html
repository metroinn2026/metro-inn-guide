<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作紀錄｜北投旅圖</title><link rel="stylesheet" href="admin.css"><style>body{padding:22px;max-width:none;margin:auto;background:#fff;color:#243247}main{max-width:100%}main>h1{margin:0 0 10px}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:20px 0 14px}.filters label{display:grid;gap:5px;font-size:13px;color:#44536a}.filters input,.filters select{height:40px;min-height:40px;max-width:200px;border:1px solid #d6dfe8;border-radius:5px;background:white}.filters button{height:40px;min-height:40px;background:#fff;color:#243247;border:1px solid #d6dfe8;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:12px 10px;text-align:left;border-bottom:1px solid #e4eaf0;vertical-align:top}th{background:#f7f9fb;color:#34435a;white-space:nowrap}td:nth-child(2){overflow-wrap:anywhere;min-width:175px;max-width:260px}td:last-child{min-width:220px;white-space:normal;overflow-wrap:anywhere}#auditMsg{color:#617084;font-size:13px;margin:12px 0}#auditTableWrap{overflow-x:auto;overflow-y:visible;max-height:none}#auditTableWrap table{min-width:880px}@media(max-width:700px){body{padding:14px}.filters label{width:100%}.filters input,.filters select{max-width:none;width:100%}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><main><p id="backLink"><a href="admin.html">← 返回管理後台</a></p><h1>操作紀錄</h1><p>僅供管理員查詢已寫入的操作紀錄；不提供資料修改或審稿功能。</p><p id="notice" role="status">確認權限中…</p><section id="app" hidden><div class="filters"><label>開始日期<input id="auditFrom" type="date"></label><label>結束日期<input id="auditTo" type="date"></label><label>功能分類<select id="auditTable"><option value="">全部功能</option></select></label><label>操作類型<select id="auditAction"><option value="">全部操作</option></select></label><label>搜尋<input id="auditSearch" type="search" placeholder="操作人、資料編號、欄位"></label><button id="reloadAudit" type="button">重新整理</button><button id="auditExport" type="button">匯出目前結果 CSV</button></div><p id="auditMsg" role="status"></p><div id="auditTableWrap"><table><thead><tr><th>時間</th><th>操作人員 Email</th><th>資料分類</th><th>資料編號</th><th>動作</th><th>異動欄位</th></tr></thead><tbody id="auditRows"></tbody></table></div></section></main><script>
'use strict';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let auditCache=[];let actorEmails=new Map();
const embedded=new URLSearchParams(location.search).has('embedded');
if(embedded){$('backLink').hidden=true;document.querySelector('main > h1').hidden=true;document.body.style.padding='0';}
function reportHeight(){if(!embedded)return;parent.postMessage({type:'metro-workspace-height',height:Math.ceil(document.documentElement.scrollHeight+16)},location.origin);}
if(embedded){new ResizeObserver(reportHeight).observe(document.querySelector('main'));window.addEventListener('load',reportHeight);}
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||''));
const actorEmail=r=>{const raw=String(r.actor_name||'');return actorEmails.get(raw.toLowerCase())||(raw.includes('@')?raw:(isUuid(raw)?'Email 未對應':'系統／未知'));};
const values=r=>[new Date(r.created_at).toLocaleString('zh-TW'),actorEmail(r),r.table_name||'',String(r.record_id??''),r.action||'',Array.isArray(r.changed_fields)?r.changed_fields.join('、'):''];
function filtered(){const from=$('auditFrom').value,to=$('auditTo').value,table=$('auditTable').value,action=$('auditAction').value,search=$('auditSearch').value.trim().toLowerCase();return auditCache.filter(r=>(!from||r.created_at.slice(0,10)>=from)&&(!to||r.created_at.slice(0,10)<=to)&&(!table||r.table_name===table)&&(!action||r.action===action)&&(!search||values(r).join(' ').toLowerCase().includes(search)));}
function display(){const body=$('auditRows');body.replaceChildren();const rows=filtered();for(const r of rows){const tr=document.createElement('tr');for(const v of values(r)){const td=document.createElement('td');td.textContent=v;tr.append(td);}body.append(tr);}reportHeight();$('auditMsg').textContent='顯示 '+rows.length+' 筆（目前載入 '+auditCache.length+' 筆，最多 1,000 筆）'+(auditCache.length===1000?'。如需更早的紀錄，請調整日期範圍。':'。');}
function options(id,items){const el=$(id),current=el.value;el.replaceChildren();const all=document.createElement('option');all.value='';all.textContent='全部';el.append(all);for(const item of [...new Set(items.filter(Boolean))].sort()){const opt=document.createElement('option');opt.value=item;opt.textContent=item;el.append(opt);}el.value=[...el.options].some(o=>o.value===current)?current:'';}
async function load(){const msg=$('auditMsg');msg.textContent='載入中…';let q=db.from('cms_audit_logs').select('created_at,actor_name,table_name,record_id,action,changed_fields').order('created_at',{ascending:false}).limit(1000);if($('auditFrom').value)q=q.gte('created_at',$('auditFrom').value+'T00:00:00');if($('auditTo').value){const next=new Date($('auditTo').value+'T00:00:00');next.setDate(next.getDate()+1);q=q.lt('created_at',next.toISOString());}const {data,error}=await q;if(error){msg.textContent='讀取失敗：'+error.message;return;}auditCache=data||[];
actorEmails=new Map();
const ids=[...new Set(auditCache.map(r=>String(r.actor_name||'').toLowerCase()).filter(isUuid))];
if(ids.length){
  const {data:emails,error:emailError}=await db.rpc('cms_audit_actor_emails',{actor_ids:ids});
  if(!emailError){for(const entry of emails||[])if(entry.actor_id&&entry.email)actorEmails.set(String(entry.actor_id).toLowerCase(),entry.email);}
  else console.warn('操作人員 Email 對應尚未啟用：',emailError.message);
}
options('auditTable',auditCache.map(r=>r.table_name));options('auditAction',auditCache.map(r=>r.action));display();}
for(const id of ['auditFrom','auditTo','auditTable','auditAction','auditSearch'])$(id).addEventListener('input',display);$('reloadAudit').onclick=load;
$('auditExport').onclick=()=>{const rows=[['時間','操作人員 Email','資料分類','資料編號','動作','異動欄位'],...filtered().map(values)];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='metro-audit-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
(async()=>{try{const {data:{user},error}=await db.auth.getUser();if(error||!user){location.replace('admin-login.html');return;}const {data:profile,error:e}=await db.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();if(e||!['admin','super_admin'].includes(profile?.role)){$('notice').textContent='沒有管理員權限。';return;}$('notice').textContent='';$('app').hidden=false;reportHeight();await load();}catch(err){$('notice').textContent='無法驗證權限：'+err.message;}})();
</script></body></html>
