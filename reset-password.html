<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重設密碼｜北投旅圖</title><link rel="stylesheet" href="admin.css"></head><body class="login-page"><main class="login-card"><h1>設定新密碼</h1><p>請由管理員帳號的密碼重設信件開啟此頁。</p><form id="resetForm" hidden><div class="form-row"><label for="password">新密碼（至少 8 碼）</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="form-row"><label for="confirmPassword">確認新密碼</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="primary full" id="submitButton" type="submit">確認重設密碼</button></form><div class="msg" id="msg" role="status" aria-live="polite">正在確認重設連結…</div><p><a href="admin-login.html">返回登入頁</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:true}});
const msg=document.getElementById('msg'),form=document.getElementById('resetForm');
let recoveryReady=false;
function ready(){recoveryReady=true;form.hidden=false;msg.textContent='連結驗證成功，請設定新密碼。';}
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready();});
(async()=>{try{
  // Supabase v2 exchanges PKCE ?code= automatically; explicit check also supports token-hash links.
  const params=new URLSearchParams(location.search);
  if(params.get('token_hash')&&params.get('type')==='recovery'){
    const {error}=await db.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});
    if(error)throw error;ready();return;
  }
  const {data:{session}}=await db.auth.getSession();
  if(session&&location.hash.includes('type=recovery'))ready();
  else setTimeout(()=>{if(!recoveryReady)msg.textContent='連結無效或已過期，請返回登入頁重新申請。';},1500);
}catch(e){msg.textContent='連結驗證失敗或已過期，請重新申請。';}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryReady)return;const password=document.getElementById('password').value;if(password!==document.getElementById('confirmPassword').value){msg.textContent='兩次密碼不一致。';return;}const btn=document.getElementById('submitButton');btn.disabled=true;try{const {error}=await db.auth.updateUser({password});if(error)throw error;await db.auth.signOut();form.hidden=true;msg.textContent='密碼已重設成功，請返回登入頁使用新密碼登入。';}catch(err){msg.textContent='重設失敗：'+err.message;}finally{btn.disabled=false;}});
</script></body></html>
