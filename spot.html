<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>景點介紹｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="transit-duration.js"></script>
  <script src="transport-guide.js?v=20261002-shared-all-details"></script>
  <script src="related-reading.js"></script>
</head>

<body id="top" class="spot-detail-page">
  <div id="header"></div>

  <section class="hero">
    <img id="heroImage" src="https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg" alt="">
    <div class="container">
      <div class="hero-content">
        <div id="heroKicker" class="kicker">SPOT DETAIL</div>
        <h1 id="heroTitle">景點介紹</h1>
        <p id="heroSubtitle">景點資料載入中...</p>
        <div class="hero-icons">
          <span id="heroStation">最近捷運站</span>
          <span id="heroHours">營業時間</span>
          <span id="heroTags">景點標籤</span>
          <span id="heroStayTime">建議停留</span>
        </div>
      </div>
    </div>
  </section>

  <section class="crumb">
    <div class="container">
      <div id="breadcrumb">首頁 〉 景點介紹</div>
      <button class="share-icon" type="button" aria-label="分享此頁">⇪</button>
    </div>
  </section>

  <main class="container article-wrap single-point">
    <article>
      <div id="storyMeta" class="meta detail-eyebrow">SPOT</div>
      <h1 id="articleTitle" class="spot-article-title">景點名稱</h1>
      <p id="leadText" class="lead">景點資料載入中...</p>

      <div id="tagListTop" class="tag-list"></div>

      <section class="story">

        <div class="story-img">
          <img id="storyImage" src="https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg" alt="">
        </div>
        <p id="storyImageSource" class="image-source-caption"></p>
        <div id="storyContent" class="detail-prose">景點資料載入中...</div>
      </section>

      <section id="info" class="info-card point-info">
        <div class="info-head-row">
          <div>
            <div class="kicker">INFORMATION</div>
            <h3 id="infoTitle">景點資訊</h3>
          </div>
          <button class="share-mini" type="button" aria-label="分享景點">⇪</button>
        </div>

        <div class="info-row"><span class="info-label">地址</span><span id="infoAddress">尚未提供</span></div>
        <div class="info-row"><span class="info-label">營業時間</span><span id="infoHours">尚未提供</span></div>
        <div class="info-row"><span class="info-label">最近捷運站</span><span id="infoStation">尚未提供</span></div>
        <div class="info-row"><span class="info-label">建議停留</span><span id="infoStayTime">尚未提供</span></div>
        <div class="info-row"><span class="info-label">景點標籤</span><span id="infoTags">尚未提供</span></div>
        <div id="infoNoteRow" class="info-row" hidden><span class="info-label">備註</span><span id="infoNote"></span></div>

        <div class="info-actions multi">
          <a id="officialButton" class="button outline" href="#" target="_blank" rel="noopener">官方網站</a>
        </div>

        <iframe id="mapEmbed" class="map-embed small" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </section>
    </article>

    <aside class="sticky-panel">
<div id="spotTransportGuide"></div>
    </aside>
  </main>

  <section id="related" class="section related" hidden></section>

  <div id="footer"></div>

  <script>
    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const fallbackImage = 'https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';

    function getParam(name) {
      return new URLSearchParams(location.search).get(name);
    }

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags).split(/[、,，]/).map(tag => tag.trim()).filter(Boolean);
    }

    function setText(id, value, fallback = '尚未提供') {
      const el = document.getElementById(id);
      if (el) el.textContent = value || fallback;
    }

    function mapEmbedUrl(item) {
      const query = [item.title, item.address].filter(Boolean).join(' ');
      // All attractions use the same Google Maps single-place embed style.
      return `https://www.google.com/maps?q=${encodeURIComponent(query)}&z=17&output=embed`;
    }

    function renderImageCaption(text){
      const el = document.getElementById('storyImageSource');
      if(!el) return;
      const raw = (text || '').trim();
      if(!raw){
        el.textContent = '';
        el.style.display = 'none';
        return;
      }
      el.textContent = raw.startsWith('圖片來源') ? raw : `圖片來源：${raw}`;
      el.style.display = 'block';
    }



    async function loadSpot() {
      const id = getParam('id');

      if (!id) {
        setText('heroSubtitle', '找不到景點代碼，請回景點列表重新進入。');
        return;
      }

      try {
        // 管理員預覽草稿：先驗證管理員身分，僅使用本分頁工作階段暫存的草稿。
        let previewSpot = null;
        if (getParam('admin_preview') === '1') {
          const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data: { user } } = await client.auth.getUser();
          if (!user) throw new Error('草稿預覽須先登入管理員。');
          const { data: profile } = await client.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();
          if (!['admin','super_admin'].includes(profile?.role)) throw new Error('沒有草稿預覽權限。');
          const { data, error } = await client.from('spots').select('*').eq('id',id).maybeSingle();
          if (error || !data) throw new Error('草稿讀取失敗，請檢查管理員讀取權限。');
          previewSpot = data;
          const banner = document.createElement('div');
          banner.textContent = '管理員草稿預覽｜此頁未公開，請勿作為正式頁面分享';
          banner.style.cssText = 'position:sticky;top:0;z-index:9999;padding:12px;text-align:center;background:#fff0bc;color:#543a00;font-weight:700';
          document.body.prepend(banner);
        }
        const response = previewSpot ? null : await fetch(
          `${SUPABASE_URL}/rest/v1/spots?id=eq.${encodeURIComponent(id)}&is_published=eq.true&select=*`,
          {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );

        const result = previewSpot ? [previewSpot] : await response.json();

        if (response && !response.ok) {
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        const spot = result[0];

        if (!spot) {
          setText('heroSubtitle', '找不到這筆景點資料。');
          return;
        }

        const tags = normalizeTags(spot.tags);
        const image = spot.cover_image || fallbackImage;
        const imageSourceText = spot.cover_image_source || spot.image_source || '';
        const stationText = spot.station ? `${spot.station}附近` : '捷運資訊請見內文';
        const title = spot.title || '景點介紹';
        const summary = spot.summary || '更多介紹即將補上。';
        const content = spot.content || summary;
        const areaText = spot.area || 'BEITOU';

        document.title = `${title}｜Metro Inn Guide 北投旅圖`;

        document.getElementById('heroImage').src = image;
        document.getElementById('heroImage').alt = title;
        document.getElementById('storyImage').src = image;
        renderImageCaption(imageSourceText);
        document.getElementById('storyImage').alt = title;

        setText('heroKicker', `${areaText} · SPOT`);
        setText('heroTitle', title);
        setText('articleTitle', title);
        setText('heroSubtitle', summary);
        setText('heroStation', stationText);
        setText('heroHours', spot.business_hours || '營業時間依公告為準');
        setText('heroTags', tags[0] || '景點');
        setText('heroStayTime', spot.stay_time || '建議停留依行程安排');

        renderBreadcrumb('景點介紹', 'spots.html', title);
        setText('leadText', summary);
        setText('storyMeta', (spot.slug || areaText).replaceAll('-', ' ').toUpperCase());
        setText('storyContent', content);

        setText('infoTitle', '景點資訊');
        setText('infoAddress', spot.address);
        setText('infoHours', spot.business_hours || '依官方公告為準');
        setText('infoStation', spot.station ? `${spot.station}附近` : '');
        setText('infoStayTime', spot.stay_time);
        setText('infoTags', tags.join('、'));
        const noteRow = document.getElementById('infoNoteRow');
        const noteText = String(spot.notes || '').trim();
        if (noteRow) noteRow.hidden = !noteText;
        setText('infoNote', noteText, '');

        renderRelatedReading(spot, document.getElementById('related'));
        MetroTransportGuide.render(document.getElementById('spotTransportGuide'), spot, {destination:[spot.title, spot.address].filter(Boolean).join(' ')});

        const tagHtml = tags.map((tag, index) =>
          `<span class="tag ${index === 0 ? 'dark' : ''}">${tag}</span>`
        ).join('');

        document.getElementById('tagListTop').innerHTML = tagHtml;

        const mapUrl = spot.google_map || `https://www.google.com/maps/search/${encodeURIComponent(title)}`;

        if (spot.official_website) {
          document.getElementById('officialButton').href = spot.official_website;
          document.getElementById('officialButton').style.display = '';
        } else {
          document.getElementById('officialButton').style.display = 'none';
        }

        const mapFrame = document.getElementById('mapEmbed');
        mapFrame.src = mapEmbedUrl(spot);
        mapFrame.title = `${title}位置地圖（Google Maps）`;

      } catch (error) {
        console.error(error);
        setText('heroSubtitle', '景點資料暫時無法載入，請稍後再試。');
        setText('leadText', '景點資料暫時無法載入，請稍後再試。');
      }
    }

    loadSpot();
  </script>
</body>
</html>
