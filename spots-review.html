<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>景點審稿與批次匯入｜北投旅圖</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{max-width:1250px;margin:auto;padding:25px;color:#333}section{border:1px solid #ddd;padding:18px;margin:18px 0;background:#fff}button,select,input,textarea{padding:9px;margin:5px}textarea{width:100%;min-height:80px}button{cursor:pointer}.muted{color:#666}.row{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.row>*{max-width:100%}.item{border-top:1px solid #ddd;padding:15px 0}.hide{display:none}.badge{background:#e5f2f7;padding:5px}.preview{width:100%;height:75vh;border:1px solid #aaa}label{display:block;margin:8px 0}.item button{margin-right:8px}</style></head><body><a href="admin.html">← 返回管理後台</a><h1>景點審稿與批次匯入</h1><p class="muted">匯入資料全部預設未公開；審核通過後才可上架。完整預覽只限已登入的管理員。</p><p id="notice" role="status">確認登入中…</p><div id="app" class="hide"><section><h2>批次匯入 JSON</h2><p>接受 UTF-8 JSON 陣列；欄位使用 spots 現有欄位名稱。每筆須有景點名稱 title；有 id 時更新相同 ID，無 id 時產生新的 spot_ 編號。不刪除原資料，不接受以匯入資料直接上架。</p><input id="file" type="file" accept=".json,application/json"><button id="import">檢查並匯入草稿</button><p id="importMsg" role="status"></p></section><section><h2>景點審稿清單</h2><div class="row"><label>狀態 <select id="filter"><option value="pending">待審核</option><option value="needs_changes">待補件</option><option value="approved">已通過</option><option value="all">全部</option></select></label><label>搜尋 <input id="search" placeholder="景點名稱、ID、地區"></label><button id="reload">重新整理</button></div><div id="items"></div></section><section id="detail" class="hide"><h2 id="detailTitle">景點審稿</h2><div class="row"><button id="preview">開啟完整網頁預覽 ↗</button><a id="edit" href="admin.html">返回後台編輯</a></div><p>資料來源（每行一筆；請逐一核對）</p><textarea id="sources" placeholder="https://..."></textarea><label>審稿備註 <textarea id="note"></textarea></label><label>審稿狀態 <select id="status"><option value="pending">待審核</option><option value="needs_changes">待補件</option><option value="approved">已通過</option></select></label><label><input type="checkbox" id="publish">審核通過並公開上架</label><button id="save">儲存審核結果</button><p id="saveMsg" role="status"></p><iframe id="frame" class="preview" title="景點完整預覽" loading="lazy"></iframe></section></div><script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let rows=[],selected=null;const allowed=['id','sort_order','slug','title','area','station','summary','content','address','business_hours','stay_time','tags','google_map','official_website','cover_image','cover_image_source','transport_metro','transport_bus','transport_car'];function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='admin-login.html';return;}const {data:profile,error}=await db.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();if(error||!['admin','super_admin'].includes(profile?.role)){$('notice').textContent='沒有管理員權限。';return;}$('app').classList.remove('hide');await load();const id=new URLSearchParams(location.search).get('id');if(id)choose(id);}async function load(){$('notice').textContent='讀取中…';const {data,error}=await db.from('spots').select('*').order('sort_order',{ascending:true}).limit(1000);if(error){$('notice').textContent='讀取失敗：'+error.message;return;}rows=data||[];$('notice').textContent='已讀取 '+rows.length+' 筆（最多 1000 筆）。';render();}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=rows.filter(r=>(f==='all'||(r.review_status||'pending')===f)&&(!q||[r.id,r.title,r.area].join(' ').toLowerCase().includes(q)));$('items').replaceChildren();if(!list.length){$('items').append(node('p','沒有符合的景點。'));return;}for(const r of list){const box=node('div');box.className='item';box.append(node('strong',r.title||'未命名'),node('p',`${r.id}｜${r.area||'未指定地區'}｜${r.review_status||'pending'}｜${r.is_published?'已上架':'未公開'}`));const b=node('button','審稿／完整預覽');b.onclick=()=>choose(r.id);box.append(b);$('items').append(box);}}function choose(id){selected=rows.find(r=>r.id===id);if(!selected)return;$('detail').classList.remove('hide');$('detailTitle').textContent='審稿：'+selected.title;$('sources').value=selected.source_urls||'';$('note').value=selected.review_note||'';$('status').value=selected.review_status||'pending';$('publish').checked=!!selected.is_published;$('edit').href='admin.html';$('frame').src='spot.html?id='+encodeURIComponent(id)+'&admin_preview=1';$('saveMsg').textContent='';$('detail').scrollIntoView({behavior:'smooth'});} $('preview').onclick=()=>{if(selected)window.open('spot.html?id='+encodeURIComponent(selected.id)+'&admin_preview=1','_blank','noopener');};$('save').onclick=async()=>{if(!selected)return;const status=$('status').value,published=$('publish').checked;if(published&&status!=='approved'){$('saveMsg').textContent='公開前必須審核通過。';return;}if(published&&!confirm('已核對景點內容、來源、圖片授權，確定公開？'))return;$('save').disabled=true;const {data:{user}}=await db.auth.getUser();const {data,error}=await db.from('spots').update({review_status:status,source_urls:$('sources').value.trim(),review_note:$('note').value.trim(),is_published:published,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',selected.id).select('id');$('save').disabled=false;if(error||!data?.length){$('saveMsg').textContent='儲存失敗：'+(error?.message||'沒有更新到資料');return;}$('saveMsg').textContent='審稿結果已儲存。';const id=selected.id;await load();choose(id);};$('import').onclick=async()=>{const file=$('file').files[0];if(!file){$('importMsg').textContent='請選擇 JSON 檔。';return;}let records;try{records=JSON.parse(await file.text());if(!Array.isArray(records)||!records.length||records.length>100)throw Error('單次須為 1～100 筆 JSON 陣列。');if(records.some(r=>!r||typeof r!=='object'||Array.isArray(r)||!String(r.title||'').trim()))throw Error('每筆都必須有 title。');}catch(e){$('importMsg').textContent='檔案格式錯誤：'+e.message;return;}if(!confirm('匯入 '+records.length+' 筆景點草稿？同 ID 會更新且下架，不會刪除其他資料。'))return;$('import').disabled=true;$('importMsg').textContent='匯入中…';const {data,error}=await db.rpc('import_spot_drafts',{p_records:records});$('import').disabled=false;if(error){$('importMsg').textContent='匯入失敗：'+error.message;return;}$('importMsg').textContent='匯入完成：'+data+' 筆。';await load();};$('filter').onchange=render;$('search').oninput=render;$('reload').onclick=load;init();
</script></body></html>
