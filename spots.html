<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>景點探索｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body id="top">
  <div id="header"></div>

  <section class="directory-hero">
    <div class="container">
      <div class="kicker">SPOTS</div>
      <h1>景點探索</h1>
      <p>從北投、新北投、陽明山到淡水，先找到想停留的地方；營業時間、地址與導航資訊留到內頁慢慢看。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-row">
        <div class="filter-pills">
          <a class="pill active" data-area="all">全部</a>
          <a class="pill" data-area="北投區">北投</a>
          <a class="pill" data-area="新北投">新北投</a>
          <a class="pill" data-area="陽明山">陽明山</a>
          <a class="pill" data-area="士林">士林</a>
          <a class="pill" data-area="淡水">淡水</a>
        </div>
        <a class="section-link" href="index.html">回首頁搜尋 →</a>
      </div>

      <div id="spotsStatus" class="empty-state">景點資料載入中...</div>
      <div id="spotsGrid" class="directory-grid"></div>

      <div class="pagination">
        <span class="active">1</span>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script>
    if (typeof header === 'function') {
      document.getElementById('header').innerHTML = header();
    }

    if (typeof footer === 'function') {
      document.getElementById('footer').innerHTML = footer();
    }

    const statusEl = document.getElementById('spotsStatus');
    const gridEl = document.getElementById('spotsGrid');
    let allSpots = [];

    const fallbackImage = 'https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags)
        .split(/[、,，]/)
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    function renderSpots(spots) {
      gridEl.innerHTML = '';

      if (!spots.length) {
        statusEl.textContent = '目前沒有符合條件的景點。';
        statusEl.style.display = 'block';
        return;
      }

      statusEl.style.display = 'none';

      spots.forEach(spot => {
        const tags = normalizeTags(spot.tags).slice(0, 2);
        const image = spot.cover_image || fallbackImage;
        const summary = spot.summary || '更多介紹即將補上。';
        const meta = spot.area || spot.station || 'BEITOU';
        const href = `spot.html?id=${encodeURIComponent(spot.id)}`;

        const card = document.createElement('a');
        card.className = 'directory-card';
        card.href = href;
        card.innerHTML = `
          <div class="directory-img">
            <img src="${escapeHtml(image)}" alt="${escapeHtml(spot.title)}">
          </div>
          <div class="directory-body">
            <div class="meta">${escapeHtml(meta)}</div>
            <h3>${escapeHtml(spot.title || '未命名景點')}</h3>
            <p>${escapeHtml(summary)}</p>
            <div class="tag-list">
              ${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    async function loadSpots() {
      try {
        if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
          throw new Error('找不到 Supabase 設定，請檢查 supabase-config.js');
        }

        const url = `${SUPABASE_URL}/rest/v1/spots?select=id,slug,title,area,station,summary,tags,cover_image,is_published&is_published=eq.true&order=id.asc`;

        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('Supabase error:', result);
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        allSpots = result;
        renderSpots(allSpots);
      } catch (error) {
        console.error(error);
        statusEl.textContent = '景點資料暫時無法載入，請稍後再試。';
      }
    }

    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.pill').forEach(item => item.classList.remove('active'));
        pill.classList.add('active');

        const area = pill.dataset.area;
        if (area === 'all') {
          renderSpots(allSpots);
        } else {
          renderSpots(allSpots.filter(spot =>
            spot.area === area ||
            spot.station === area ||
            String(spot.area || '').includes(area) ||
            String(spot.station || '').includes(area)
          ));
        }
      });
    });

    loadSpots();
  </script>
</body>
</html>
