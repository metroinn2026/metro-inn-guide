<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>景點探索｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
</head>

<body id="top">
  <div id="header"></div>

  <section class="directory-hero">
    <div class="container">
      <div class="kicker">SPOTS</div>
      <h1 id="directoryTitle">景點探索</h1>
      <p id="directorySummary">從北投、新北投、陽明山到淡水，先找到想停留的地方；營業時間、地址與導航資訊留到內頁慢慢看。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-row">
        <div id="directoryFilters" class="filter-pills"></div>
        <a class="section-link" href="index.html">回首頁搜尋 →</a>
      </div>

      <div id="spotsStatus" class="empty-state">景點資料載入中...</div>
      <div id="spotsGrid" class="directory-grid"></div>

      <div class="pagination" aria-label="景點分頁"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="directory-pagination.js"></script>
<script>
    if (typeof header === 'function') {
      document.getElementById('header').innerHTML = header();
    }

    if (typeof footer === 'function') {
      document.getElementById('footer').innerHTML = footer();
    }

    const statusEl = document.getElementById('spotsStatus');
    const gridEl = document.getElementById('spotsGrid');
    let allSpots = [];
    const defaultFilters = ['全部','北投','新北投','陽明山','士林','淡水'];

    const fallbackImage = 'https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalizeTags(tags) {
      if (!tags) return [];
      if (Array.isArray(tags)) return tags;
      return String(tags)
        .split(/[、,，]/)
        .map(tag => tag.trim())
        .filter(Boolean);
    }

    function parseDirectoryFilters(value) {
      const labels = String(value || '').split(/[、,，\n]/).map(x => x.trim()).filter(Boolean);
      return labels.length ? labels : defaultFilters;
    }

    function renderDirectoryFilters(labels) {
      const root = document.getElementById('directoryFilters');
      const normalized = labels[0] === '全部' ? labels : ['全部', ...labels.filter(x => x !== '全部')];
      root.innerHTML = normalized.map((label, index) => `<button type="button" class="pill${index === 0 ? ' active' : ''}" data-filter="${escapeHtml(index === 0 ? 'all' : label)}">${escapeHtml(label)}</button>`).join('');
      root.querySelectorAll('.pill').forEach(pill => pill.addEventListener('click', () => {
        root.querySelectorAll('.pill').forEach(item => item.classList.remove('active'));
        pill.classList.add('active');
        const keyword = pill.dataset.filter;
        renderSpots(keyword === 'all' ? allSpots : allSpots.filter(spot => [spot.area, spot.station, spot.tags].filter(Boolean).join(' ').includes(keyword)));
      }));
    }

    async function loadDirectorySettings() {
      renderDirectoryFilters(defaultFilters);
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/site_settings?id=eq.1&select=spots_directory_title,spots_directory_summary,spots_directory_tags`, {cache:'no-store', headers:{apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});
        if(!response.ok) return;
        const settings = (await response.json())?.[0];
        if(!settings) return;
        if(settings.spots_directory_title) document.getElementById('directoryTitle').textContent = settings.spots_directory_title;
        if(settings.spots_directory_summary) document.getElementById('directorySummary').textContent = settings.spots_directory_summary;
        renderDirectoryFilters(parseDirectoryFilters(settings.spots_directory_tags));
      } catch(error) { console.warn('景點目錄設定載入失敗，使用預設值。', error); }
    }

    function renderSpotsPage(spots) {
      gridEl.innerHTML = '';

      if (!spots.length) {
        statusEl.textContent = '目前沒有符合條件的景點。';
        statusEl.style.display = 'block';
        return;
      }

      statusEl.style.display = 'none';

      spots.forEach(spot => {
        const tags = normalizeTags(spot.tags).slice(0, 2);
        const image = spot.cover_image || fallbackImage;
        const summary = spot.summary || '更多介紹即將補上。';
        const meta = spot.area || spot.station || 'BEITOU';
        const href = `spot.html?id=${encodeURIComponent(spot.id)}`;

        const card = document.createElement('a');
        card.className = 'directory-card';
        card.href = href;
        card.innerHTML = `
          <div class="directory-img">
            <img src="${escapeHtml(image)}" alt="${escapeHtml(spot.title)}">
          </div>
          <div class="directory-body">
            <div class="meta">${escapeHtml(meta)}</div>
            <h3>${escapeHtml(spot.title || '未命名景點')}</h3>
            <p>${escapeHtml(summary)}</p>
            <div class="tag-list">
              ${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    const directoryPager = createDirectoryPager(document, renderSpotsPage);
    function renderSpots(items) { directoryPager.setRecords(items); }

    async function loadSpots() {
      try {
        if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
          throw new Error('找不到 Supabase 設定，請檢查 supabase-config.js');
        }

        const url = `${SUPABASE_URL}/rest/v1/spots?select=id,slug,title,area,station,summary,tags,cover_image,is_published,sort_order&is_published=eq.true&order=sort_order.asc,id.asc`;

        const response = await fetch(url, {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('Supabase error:', result);
          throw new Error(result.message || 'Supabase 讀取失敗');
        }

        allSpots = result;
        renderSpots(allSpots);
      } catch (error) {
        console.error(error);
        statusEl.textContent = '景點資料暫時無法載入，請稍後再試。';
      }
    }

    loadDirectorySettings();
    loadSpots();
  </script>
</body>
</html>
