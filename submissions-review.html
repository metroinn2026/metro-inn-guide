<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>民眾投稿審核｜北投旅圖</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{padding:16px;max-width:none;margin:auto}body.embedded .standalone-back{display:none}section{border:1px solid #ddd;padding:18px;margin:15px 0}button,select{margin:5px;padding:8px}textarea{width:100%;min-height:80px}.entry{white-space:pre-wrap;line-height:1.8}.muted{color:#666}.hide{display:none}</style></head><body><a class="standalone-back" href="admin.html">← 返回管理後台</a><h1>民眾投稿審核</h1><p>僅登入管理員可讀取投稿。請先核對內容、署名及授權，再審核上架；待審稿件不會公開。</p><div id="notice" role="status">確認登入中…</div><div id="controls" class="hide"><label>狀態篩選 <select id="filter"><option value="pending">待審核</option><option value="needs_changes">待補件</option><option value="approved">已通過</option><option value="rejected">不採用</option><option value="all">全部</option></select></label><button id="reload">重新整理</button><div id="items"></div></div><script>if(new URLSearchParams(location.search).has("embedded"))document.body.classList.add("embedded");const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),notice=document.getElementById('notice'),items=document.getElementById('items');let rows=[];function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x;}async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='admin-login.html';return;}const {data:profile,error}=await db.from('admin_profiles').select('role').eq('id',user.id).maybeSingle();if(error||!['admin','super_admin'].includes(profile?.role)){notice.textContent='此帳號沒有審稿權限。';return;}document.getElementById('controls').classList.remove('hide');await load();}async function load(){notice.textContent='載入中…';const {data,error}=await db.from('travel_submissions').select('*').order('created_at',{ascending:false}).limit(300);if(error){notice.textContent='讀取失敗：'+error.message;return;}rows=data||[];notice.textContent='已載入 '+rows.length+' 筆（最多顯示最近 300 筆）。';render();}function render(){items.replaceChildren();const filter=document.getElementById('filter').value;const list=rows.filter(r=>filter==='all'||r.review_status===filter);if(!list.length){items.append(el('p','沒有符合的稿件。'));return;}for(const r of list){const section=el('section');section.append(el('h2',r.title),el('p',`${r.submission_type}｜${r.area||'未指定地區'}｜${r.created_at}｜狀態：${r.review_status}｜${r.is_published?'已公開':'未公開'}`),el('p','對應景點：'+(r.spot_id||'未指定')),el('p','公開署名：'+r.public_name),el('p','聯絡 Email（僅後台）：'+r.author_email));const content=el('div',r.content);content.className='entry';section.append(content);if(r.image_url)section.append(el('p','圖片連結：'+r.image_url));const note=el('textarea');note.placeholder='審稿備註（待補件原因等）';note.value=r.review_note||'';section.append(el('p','審稿備註'),note);const status=el('select');for(const [v,t] of [['pending','待審核'],['needs_changes','待補件'],['approved','通過'],['rejected','不採用']]){const o=el('option',t);o.value=v;status.append(o);}status.value=r.review_status;section.append(status);const publish=el('input');publish.type='checkbox';publish.checked=r.is_published;const label=el('label','審核通過後公開');label.prepend(publish);section.append(label);const save=el('button','儲存審核結果');section.append(save);const msg=el('p');section.append(msg);save.onclick=async()=>{if(publish.checked&&status.value!=='approved'){msg.textContent='公開前請先選擇「通過」。';return;}if(publish.checked&&!confirm('確定內容、圖片授權及個資均已核對，並公開此投稿？'))return;save.disabled=true;const {data:{user}}=await db.auth.getUser();const {data,error}=await db.from('travel_submissions').update({review_status:status.value,is_published:publish.checked,review_note:note.value.trim(),reviewed_at:new Date().toISOString(),reviewed_by:user.id,updated_at:new Date().toISOString()}).eq('id',r.id).select('id');save.disabled=false;if(error||!data?.length){msg.textContent='儲存失敗：'+(error?.message||'沒有更新到資料');return;}msg.textContent='已儲存。';await load();};items.append(section);}}document.getElementById('filter').onchange=render;document.getElementById('reload').onclick=load;init();</script></body></html>
