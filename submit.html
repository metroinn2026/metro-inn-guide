<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅人投稿｜北投旅圖</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.submit-wrap{max-width:760px;margin:auto}.submit-wrap label{display:block;margin:16px 0 6px}.submit-wrap input,.submit-wrap textarea,.submit-wrap select{width:100%;padding:12px;border:1px solid #bbb;border-radius:0}.submit-wrap textarea{min-height:180px}.submit-wrap .check{display:flex;gap:8px;align-items:flex-start}.submit-wrap .check input{width:auto;margin-top:5px}.submit-wrap button{margin-top:18px}.submit-wrap .note{color:#666;font-size:14px}</style></head><body><div id="header"></div><main class="container section submit-wrap"><h1>分享你的北投故事</h1><p>分享景點心得、完整遊記或推薦新景點。投稿須經編輯審核，通過後才會公開。</p><p class="notice">第一階段已開放文字投稿。圖片上傳尚未啟用，請勿在內容中填入私人相簿或未授權圖片連結。</p><form id="submissionForm"><label for="type">投稿類型 *</label><select id="type" required><option value="spot_review">景點心得</option><option value="travel_story">旅人遊記</option><option value="new_spot">推薦新景點</option></select><label for="title">標題 *</label><input id="title" maxlength="120" minlength="2" required><label for="spot">對應景點編號（景點心得可填，例如 spot_0001）</label><input id="spot" maxlength="60" placeholder="可留空，由編輯協助關聯"><label for="area">地區</label><select id="area"><option value="">未指定</option><option>北投</option><option>新北投</option><option>陽明山</option><option>士林</option><option>淡水</option></select><label for="content">投稿內容 *（至少 20 字）</label><textarea id="content" minlength="20" maxlength="10000" required></textarea><label for="author">投稿人姓名／暱稱 *</label><input id="author" maxlength="60" required><label for="publicName">公開署名 *</label><input id="publicName" maxlength="60" required><label for="email">聯絡 Email *（不會公開）</label><input id="email" type="email" maxlength="254" required><label class="check"><input id="rights" type="checkbox" required><span>我確認文字為本人創作或已取得必要授權，同意網站經審核後刊登；如需撤稿可透過網站聯絡管道提出。</span></label><label class="check"><input id="privacy" type="checkbox" required><span>我了解投稿資料及聯絡 Email 將用於審稿與聯繫，公開頁面僅顯示我填寫的公開署名與核准內容。</span></label><p class="note">請勿提供他人的電話、地址或其他個人資料。正式上線前，請管理者補齊完整隱私告知及投稿授權條款。</p><button class="button" id="send" type="submit">送出投稿</button><p id="msg" role="status" aria-live="polite"></p></form></main><div id="footer"></div><script>document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);document.getElementById('submissionForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,btn=document.getElementById('send'),msg=document.getElementById('msg');btn.disabled=true;msg.textContent='投稿送出中…';try{const payload={submission_type:document.getElementById('type').value,title:document.getElementById('title').value.trim(),spot_id:document.getElementById('spot').value.trim()||null,area:document.getElementById('area').value||null,content:document.getElementById('content').value.trim(),author_name:document.getElementById('author').value.trim(),public_name:document.getElementById('publicName').value.trim(),author_email:document.getElementById('email').value.trim(),rights_confirmed:document.getElementById('rights').checked,privacy_confirmed:document.getElementById('privacy').checked};if(payload.content.length<20)throw Error('投稿內容至少 20 字。');const {error}=await db.from('travel_submissions').insert(payload);if(error)throw error;f.reset();msg.textContent='投稿已送出，待編輯審核後才會公開。';}catch(err){msg.textContent='送出失敗：'+err.message+'。若尚未建立投稿資料表，請管理者先執行 submissions.sql。';}finally{btn.disabled=false;}});</script></body></html>
