<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行程｜Metro Inn Guide 北投旅圖</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="supabase-config.js"></script>
  <style>
    .trip-step-card{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:28px;
      padding:42px 0;
      border-bottom:1px solid var(--line,#E5E7EB);
    }
    .trip-step-no{
      font-size:64px;
      line-height:1;
      font-weight:800;
      color:#78906f;
      letter-spacing:.04em;
    }
    .trip-step-body h2{
      font-size:34px;
      margin:0 0 18px;
    }
    .trip-time{
      color:#3d7db4;
      font-weight:700;
      letter-spacing:.08em;
      margin-bottom:8px;
    }
    .trip-step-body p{
      font-size:18px;
      line-height:2;
      color:#5f6f72;
    }
    .trip-step-body img{
      width:100%;
      max-height:520px;
      object-fit:cover;
      margin-top:24px;
    }
    @media(max-width:760px){
      .trip-step-card{grid-template-columns:1fr;gap:8px;padding:30px 0}
      .trip-step-no{font-size:46px}
      .trip-step-body h2{font-size:28px}
    }
  
    .image-source-caption{margin-top:8px;font-size:13px;line-height:1.7;color:#7A8588}
</style>
</head>

<body id="top">
  <div id="header"></div>

  <section class="hero">
    <img id="heroImage" src="https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg">
    <div class="container">
      <div class="hero-content">
        <div class="kicker">TRIP</div>
        <h1 id="tripTitle">行程載入中...</h1>
        <p id="tripSummary">正在讀取行程資料。</p>
        <div class="hero-icons">
          <span id="tripDuration">建議時間</span>
          <span>捷運＋步行</span>
          <span>自由安排</span>
        </div>
      </div>
    </div>
  </section>

  <div class="crumb">
    <div class="container">
      <div id="breadcrumb">首頁　›　行程</div>
      <button class="share-icon" type="button" aria-label="分享此頁">⇪</button>
    </div>
  </div>

  <main class="container article-wrap">
    <article>
      <p id="leadText" class="lead">行程資料載入中...</p>

      <section id="tripSections"></section>

      <section id="routeBox" class="info-card point-info" style="display:none">
        <div class="kicker">ROUTE MAP</div>
        <h3>本次路線地圖</h3>
        <p>可開啟 Google Maps 查看路線與實際交通時間。</p>
        <div class="info-actions multi">
          <a id="routeLink" class="button" target="_blank">開啟 Google Maps</a>
        </div>
      </section>
    </article>

    <aside class="sidebar">
      <div class="sticky-panel">
        <div class="sidebox compact">
          <div class="kicker">TRIP INFO</div>
          <h3 id="sideTitle">行程</h3>
          <p id="sideDuration">建議時間</p>
          <p>🚇 捷運＋步行</p>
          <p>適合依照停留時間彈性調整。</p>
          <a id="sideRoute" class="button outline" target="_blank" style="display:none">路線地圖</a>
        </div>

        <div class="sidebox compact dark">
          <div class="kicker" style="color:white">STAY NEARBY</div>
          <h3>入住北捷行旅</h3>
          <p>把一晚留給北投，讓散步、泡湯與晚風慢慢開始。</p>
          <a href="https://rwd.ezhotel.cloud/btresort/1" target="_blank">立即訂房 ↗</a>
        </div>
      </div>
    </aside>
  </main>

  <div id="footer"></div>

  <script>
function formatTripImageSource(text){
  const t = (text || '').trim();
  if(!t) return '';
  return t.startsWith('圖片來源') ? t : '圖片來源：' + t;
}

    document.getElementById('header').innerHTML = header();
    document.getElementById('footer').innerHTML = footer();

    const fallbackImage = 'https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';

    function getParam(name){ return new URLSearchParams(location.search).get(name); }
    function setText(id,value,fallback=''){ const el=document.getElementById(id); if(el) el.textContent=value||fallback; }

    function parseLegacyContent(content){
      if(!content) return [];
      return String(content).split(/\n+/).filter(Boolean).map((line,index)=>{
        const parts = line.split('|').map(x=>x.trim());
        if(parts.length >= 3){
          return {time:parts[0], title:parts[1], text:parts.slice(2).join('｜'), image:'', order:index+1};
        }
        return {time:'', title:`第 ${index+1} 段`, text:line, image:'', order:index+1};
      });
    }

    function renderSections(sections, legacyContent){
      const wrap = document.getElementById('tripSections');
      const list = Array.isArray(sections) && sections.length
        ? sections.slice().sort((a,b)=>(a.order||0)-(b.order||0))
        : parseLegacyContent(legacyContent);

      if(!list.length){
        wrap.innerHTML = '<p>行程分段即將補上。</p>';
        return;
      }

      wrap.innerHTML = list.map((s,index)=>`
        <section class="trip-step-card">
          <div class="trip-step-no">${String(index+1).padStart(2,'0')}</div>
          <div class="trip-step-body">
            ${s.time ? `<div class="trip-time">${s.time}</div>` : ''}
            <h2>${s.title || '行程段落'}</h2>
            <p>${(s.text || '').replace(/\n/g,'<br>')}</p>
            ${s.image ? `<img src="${s.image}" alt="${s.title || '行程圖片'}">${s.image_source ? `<p class="image-source-caption">${formatTripImageSource(s.image_source)}</p>` : ''}` : ''}
          </div>
        </section>
      `).join('');
    }

    async function loadTrip(){
      const id = getParam('id');
      if(!id){
        setText('tripTitle','找不到行程');
        setText('tripSummary','請從行程列表重新進入。');
        return;
      }

      try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/trips?id=eq.${encodeURIComponent(id)}&select=*`,{
          headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}
        });
        const result = await res.json();
        if(!res.ok) throw new Error(result.message || '讀取失敗');

        const trip = result[0];
        if(!trip){
          setText('tripTitle','找不到行程');
          setText('tripSummary','這筆行程不存在或尚未上架。');
          return;
        }

        const image = trip.cover_image || fallbackImage;
        document.title = `${trip.title || '行程'}｜Metro Inn Guide 北投旅圖`;
        document.getElementById('heroImage').src = image;

        setText('tripTitle', trip.title);
        setText('tripSummary', trip.summary);
        setText('leadText', trip.summary);
        setText('tripDuration', trip.duration || '建議時間');
        setText('sideTitle', trip.title);
        setText('sideDuration', trip.duration ? `⏱ ${trip.duration}` : '⏱ 建議時間');
        setText('breadcrumb', `首頁　›　行程　›　${trip.title || ''}`);

        renderSections(trip.trip_sections, trip.content);

        if(trip.google_route){
          document.getElementById('routeBox').style.display = 'block';
          document.getElementById('routeLink').href = trip.google_route;
          document.getElementById('sideRoute').href = trip.google_route;
          document.getElementById('sideRoute').style.display = 'inline-flex';
        }
      }catch(error){
        console.error(error);
        setText('tripTitle','行程資料暫時無法載入');
        setText('tripSummary','請稍後再試。');
      }
    }

    loadTrip();
  </script>
</body>
</html>
