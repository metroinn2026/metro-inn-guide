<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行程目錄｜Metro Inn Guide 北投旅圖</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="supabase-config.js"></script></head><body id="top"><div id="header"></div>
<section class="directory-hero"><div class="container"><div class="kicker">JOURNEYS DIRECTORY</div><h1>行程目錄</h1><p>如果旅客不想自己規劃，可以直接從半日遊、一日遊、親子遊與雨天備案中挑選。</p></div></section>
<section class="section"><div class="container"><div class="filter-row"><div class="filter-pills"><a class="pill active" data-keyword="all">全部</a><a class="pill" data-keyword="北投">北投</a><a class="pill" data-keyword="新北投">新北投</a><a class="pill" data-keyword="陽明山">陽明山</a><a class="pill" data-keyword="士林">士林</a><a class="pill" data-keyword="淡水">淡水</a></div><a class="section-link" href="index.html">回首頁搜尋 →</a></div>
<div id="tripsStatus" class="empty-state">行程資料載入中...</div><div id="tripsGrid" class="directory-grid"></div><div class="pagination"><span class="active">1</span></div></div></section><div id="footer"></div>
<script>
document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();
const statusEl=document.getElementById('tripsStatus');const gridEl=document.getElementById('tripsGrid');let allTrips=[];
const fallbackImage='https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';
function meta(t){const x=(t.title+' '+t.summary+' '+t.content).toUpperCase(); if(x.includes('陽明山'))return'YANGMINGSHAN'; if(x.includes('淡水'))return'TAMSUI'; if(x.includes('士林'))return'SHILIN'; if(x.includes('北投'))return'BEITOU'; return'JOURNEY';}
function renderTrips(trips){gridEl.innerHTML=''; if(!trips.length){statusEl.textContent='目前沒有符合條件的行程。';statusEl.style.display='block';return;} statusEl.style.display='none'; trips.forEach(t=>{const a=document.createElement('a');a.className='directory-card';a.href=`trip.html?id=${encodeURIComponent(t.id)}`;a.innerHTML=`<div class="directory-img"><img src="${t.cover_image||fallbackImage}" alt="${t.title||''}"></div><div class="directory-body"><div class="meta">${meta(t)} · ${t.duration||'ROUTE'}</div><h3>${t.title||'未命名行程'}</h3><p>${t.summary||'更多行程介紹即將補上。'}</p><span class="arrow">→</span></div>`;gridEl.appendChild(a);});}
async function loadTrips(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/trips?is_published=eq.true&select=*&order=id.asc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});const data=await r.json(); if(!r.ok) throw new Error(data.message||'Supabase讀取失敗'); allTrips=data; renderTrips(allTrips);}catch(e){console.error(e);statusEl.textContent='行程資料暫時無法載入，請稍後再試。';}}
document.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');const k=p.dataset.keyword;if(k==='all')renderTrips(allTrips);else renderTrips(allTrips.filter(t=>(t.title+' '+t.summary+' '+t.content).includes(k)));}));
loadTrips();
</script></body></html>
