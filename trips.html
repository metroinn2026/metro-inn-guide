<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行程目錄｜Metro Inn Guide 北投旅圖</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="supabase-config.js"></script></head><body id="top"><div id="header"></div>
<section class="directory-hero"><div class="container"><div class="kicker">JOURNEYS DIRECTORY</div><h1 id="directoryTitle">行程目錄</h1><p id="directorySummary">如果旅客不想自己規劃，可以直接從半日遊、一日遊、親子遊與雨天備案中挑選。</p></div></section>
<section class="section"><div class="container"><div class="filter-row"><div id="directoryFilters" class="filter-pills"></div><a class="section-link" href="index.html">回首頁搜尋 →</a></div>
<div id="tripsStatus" class="empty-state">行程資料載入中...</div><div id="tripsGrid" class="directory-grid"></div><div class="pagination" aria-label="行程分頁"></div></div></section><div id="footer"></div>
<script src="directory-pagination.js"></script>
<script>
document.getElementById('header').innerHTML=header();document.getElementById('footer').innerHTML=footer();
const statusEl=document.getElementById('tripsStatus');const gridEl=document.getElementById('tripsGrid');let allTrips=[];
const defaultFilters=['全部','半日遊','一日遊','親子遊','雨天備案'];
const fallbackImage='https://commons.wikimedia.org/wiki/Special:FilePath/Thermal%20Valley%20beitou%20Taiwan.jpg';
function meta(t){const x=(t.title+' '+t.summary+' '+t.content).toUpperCase(); if(x.includes('陽明山'))return'YANGMINGSHAN'; if(x.includes('淡水'))return'TAMSUI'; if(x.includes('士林'))return'SHILIN'; if(x.includes('北投'))return'BEITOU'; return'JOURNEY';}
function renderTripsPage(trips){gridEl.innerHTML=''; if(!trips.length){statusEl.textContent='目前沒有符合條件的行程。';statusEl.style.display='block';return;} statusEl.style.display='none'; trips.forEach(t=>{const a=document.createElement('a');a.className='directory-card';a.href=`trip.html?id=${encodeURIComponent(t.id)}`;a.innerHTML=`<div class="directory-img"><img src="${t.cover_image||fallbackImage}" alt="${t.title||''}"></div><div class="directory-body"><div class="meta">${meta(t)} · ${t.duration||'ROUTE'}</div><h3>${t.title||'未命名行程'}</h3><p>${t.summary||'更多行程介紹即將補上。'}</p><span class="arrow">→</span></div>`;gridEl.appendChild(a);});}
const directoryPager = createDirectoryPager(document, renderTripsPage);
function renderTrips(items){directoryPager.setRecords(items);}
function escapeHtml(value){return String(value||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function parseDirectoryFilters(value){const labels=String(value||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);return labels.length?labels:defaultFilters;}
function renderDirectoryFilters(labels){const root=document.getElementById('directoryFilters');const normalized=labels[0]==='全部'?labels:['全部',...labels.filter(x=>x!=='全部')];root.innerHTML=normalized.map((label,index)=>`<button type="button" class="pill${index===0?' active':''}" data-filter="${escapeHtml(index===0?'all':label)}">${escapeHtml(label)}</button>`).join('');root.querySelectorAll('.pill').forEach(p=>p.addEventListener('click',()=>{root.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');const keyword=p.dataset.filter;renderTrips(keyword==='all'?allTrips:allTrips.filter(t=>[t.title,t.summary,t.content,t.duration,t.tags].filter(Boolean).join(' ').includes(keyword)));}));}
async function loadDirectorySettings(){renderDirectoryFilters(defaultFilters);try{const response=await fetch(`${SUPABASE_URL}/rest/v1/site_settings?id=eq.1&select=trips_directory_title,trips_directory_summary,trips_directory_tags`,{cache:'no-store',headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!response.ok)return;const settings=(await response.json())?.[0];if(!settings)return;if(settings.trips_directory_title)document.getElementById('directoryTitle').textContent=settings.trips_directory_title;if(settings.trips_directory_summary)document.getElementById('directorySummary').textContent=settings.trips_directory_summary;renderDirectoryFilters(parseDirectoryFilters(settings.trips_directory_tags));}catch(error){console.warn('行程目錄設定載入失敗，使用預設值。',error);}}
async function loadTrips(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/trips?is_published=eq.true&select=*&order=sort_order.asc,id.asc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});const data=await r.json(); if(!r.ok) throw new Error(data.message||'Supabase讀取失敗'); allTrips=data; renderTrips(allTrips);}catch(e){console.error(e);statusEl.textContent='行程資料暫時無法載入，請稍後再試。';}}
loadDirectorySettings();
loadTrips();
</script></body></html>
