<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>取消訂閱｜北投旅圖</title>
    <link rel="stylesheet" href="style.css" />
    <script src="data.js"></script>
    <script src="supabase-config.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main
      class="container section"
      style="max-width: 720px; text-align: center"
    >
      <div class="kicker">NEWSLETTER</div>
      <h1>取消訂閱電子報</h1>
      <p id="message">處理中…</p>
      <p><a class="button" href="index.html">返回北投旅圖</a></p>
    </main>
    <div id="footer"></div>
    <script>
      document.getElementById("header").innerHTML = header();
      document.getElementById("footer").innerHTML = footer();
      (async () => {
        const message = document.getElementById("message"),
          token = new URLSearchParams(location.search).get("token");
        if (!token) {
          message.textContent = "取消訂閱連結不完整。";
          return;
        }
        try {
          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/newsletter_unsubscribe`,
            {
              method: "POST",
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ token }),
            },
          );
          const result = await response.json();
          if (!response.ok) throw Error();
          message.textContent = result
            ? "已完成取消訂閱，之後不會再收到北投旅圖電子報。"
            : "此連結已取消訂閱或已失效。";
        } catch (error) {
          message.textContent = "目前無法處理，請稍後再試。";
        }
      })();
    </script>
  </body>
</html>
